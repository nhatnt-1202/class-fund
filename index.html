/* ==========================================================================
   IMPORT — đọc file Excel danh sách lớp
   File thật (Danh sách đóng góp quỹ lớp DCXDXD69_03B) có 5 cái bẫy:
     1. 9 dòng tiêu đề hành chính trước bảng      → tự dò dòng header
     2. Ô "Họ và tên SV" merge 2 cột (C10:D10)    → ghép cột họ đệm + cột tên
     3. Mã SV lưu dạng số (2.400000001E9)         → normCode() ép về string nguyên
     4. Ngày sinh là serial Excel (38918)         → excelSerialToISO() hệ 1900
     5. Dòng cuối là "Tổng quỹ : 1000000"         → dừng đọc, không thành sinh viên
   ========================================================================== */
const IMPORT_FIELDS = [
  { key:'skip',      label:'— Bỏ qua cột này —', aliases:[] },
  { key:'stt',       label:'STT',                aliases:['stt','so tt','sott','no','#'] },
  { key:'code',      label:'Mã SV',              aliases:['ma sv','masv','mssv','ma sinh vien','student code','ma so sv'] },
  { key:'lastName',  label:'Họ và tên đệm',      aliases:['ho va ten sv','ho va ten','ho ten','ho va ten dem','ho','fullname','full name','ten sinh vien'] },
  { key:'firstName', label:'Tên (cột tách riêng)',aliases:['ten'] },
  { key:'dob',       label:'Ngày sinh',          aliases:['ngay sinh','ngaysinh','dob','ns','sinh ngay'] },
  { key:'classCode', label:'Lớp',                aliases:['lop','class','lop hoc'] },
  { key:'status',    label:'Trạng thái nộp',     aliases:['trang thai','tinh trang','trang thai nop'] },
  { key:'amount',    label:'Số tiền đã nộp',     aliases:['so tien','so tien da nop','da nop','so tien nop'] },
  { key:'payDate',   label:'Ngày nộp',           aliases:['ngay','ngay nop','ngay dong'] },
  { key:'note',      label:'Ghi chú',            aliases:['ghi chu','note','phat sinh','mua','ghichu'] },
];
function guessField(headerText){
  const h = noAccent(headerText);
  if (!h) return 'skip';
  for (const f of IMPORT_FIELDS){
    if (f.key === 'skip') continue;
    if (f.aliases.some(a => h === a)) return f.key;
  }
  for (const f of IMPORT_FIELDS){
    if (f.key === 'skip') continue;
    if (f.aliases.some(a => h.includes(a))) return f.key;
  }
  return 'skip';
}
/** Dò dòng tiêu đề bảng trong 30 dòng đầu: dòng phải có 'STT' và ('Mã SV' hoặc 'Họ và tên'). */
function detectHeaderRow(aoa){
  const lim = Math.min(aoa.length, 30);
  for (let r = 0; r < lim; r++){
    const cells = (aoa[r]||[]).map(c => noAccent(c));
    const hasStt  = cells.some(c => c === 'stt' || c.startsWith('stt'));
    const hasName = cells.some(c => c.includes('ma sv') || c.includes('masv') || c.includes('mssv') || c.includes('ho va ten'));
    if (hasStt && hasName) return r;
  }
  for (let r = 0; r < lim; r++){                       // dự phòng: chỉ cần có 'ma sv' / 'ho va ten'
    const cells = (aoa[r]||[]).map(c => noAccent(c));
    if (cells.some(c => c.includes('ma sv') || c.includes('ho va ten'))) return r;
  }
  return -1;
}
/** Rút thông tin lớp từ các dòng tiêu đề hành chính phía trên bảng. */
function detectMeta(aoa, headerRow){
  const text = aoa.slice(0, Math.max(headerRow,0)).flat()
    .filter(c => typeof c === 'string').join(' | ');
  const out = {};
  let m;
  if ((m = /KHOA\s*:\s*([^|\-–—]+)/i.exec(text)))         out.faculty    = m[1].trim();
  if ((m = /L.P\s*:\s*([A-Za-z0-9_.\-]+)/i.exec(text)))    out.className  = m[1].trim().toUpperCase();
  if ((m = /H.C\s*K.\s*([IVX]+)/i.exec(text)))             out.term       = 'Học kỳ ' + m[1].toUpperCase();
  if ((m = /(\d{4})\s*[-–]\s*(\d{4})/.exec(text)))         out.schoolYear = m[1] + '-' + m[2];
  return out;
}
/** Tách 'Trần Văn Mẫu' → { lastName:'Trần Văn', firstName:'Mẫu' } (tên là từ cuối). */
function splitName(full){
  const parts = String(full||'').trim().replace(/\s+/g,' ').split(' ');
  if (parts.length <= 1) return { lastName:'', firstName: parts[0] || '' };
  return { lastName: parts.slice(0,-1).join(' '), firstName: parts[parts.length-1] };
}
const isEmptyCell = c => c === null || c === undefined || String(c).trim() === '';
/**
 * Dò dòng tổng ở cuối bảng ('Tổng quỹ : … 1000000') để đối chiếu số liệu.
 * Phải quét riêng trên toàn sheet: trong file thật dòng tổng nằm cách bảng 4 dòng trống,
 * nên vòng đọc dữ liệu (dừng ở 2 dòng trống) không bao giờ chạm tới nó.
 */
function findFooterTotal(aoa, fromRow){
  for (let r = Math.max(fromRow, 0); r < aoa.length; r++){
    const row = aoa[r] || [];
    const first = row.find(c => !isEmptyCell(c));
    if (isEmptyCell(first)) continue;
    const nf = noAccent(first);
    if (/^(tong|cong)\b/.test(nf)){
      const nums = row.filter(c => typeof c === 'number');
      if (nums.length) return int(nums[nums.length - 1]);
      const parsed = row.map(c => parseMoney(c)).filter(n => n > 0);
      if (parsed.length) return parsed[parsed.length - 1];
    }
  }
  return null;
}
/** Đọc các dòng dữ liệu, dừng đúng chỗ trước dòng tổng. */
function extractRows(aoa, headerRow, mapping){
  const rows = [];
  let blank = 0, footerTotal = null, stoppedAt = aoa.length;
  for (let r = headerRow + 1; r < aoa.length; r++){
    const row = aoa[r] || [];
    if (row.every(isEmptyCell)){
      if (++blank >= 2){ stoppedAt = r; break; }
      continue;
    }
    blank = 0;
    const firstText = row.find(c => !isEmptyCell(c));
    const nf = noAccent(firstText);
    if (/^(tong|cong)\b/.test(nf) || nf.startsWith('tong quy') || nf.startsWith('tong cong')){
      const nums = row.filter(c => typeof c === 'number');
      if (nums.length) footerTotal = int(nums[nums.length-1]);
      stoppedAt = r; break;                                    // BẪY 5: dòng tổng, không phải sinh viên
    }
    if (noAccent(row.map(c=>c==null?'':c).join(' ')).includes('ma sv')) continue;   // header lặp lại
    const get = key => {
      const idx = Object.keys(mapping).find(i => mapping[i] === key);
      return idx === undefined ? null : row[idx];
    };
    const rec = {
      _row: r + 1,
      stt: get('stt') == null ? '' : String(get('stt')).replace(/\.0+$/,''),
      code: normCode(get('code')),                                              // BẪY 3
      dob: parseDateFlexible(get('dob')),                                       // BẪY 4
      classCode: get('classCode') == null ? '' : String(get('classCode')).trim(),
      status: noAccent(get('status')),
      amount: parseMoney(get('amount')),
      payDate: parseDateFlexible(get('payDate')),
      note: get('note') == null ? '' : String(get('note')).trim(),
    };
    // BẪY 2: tên có thể nằm ở 1 cột hoặc bị tách 2 cột do ô header bị merge
    const a = get('lastName'), b = get('firstName');
    if (!isEmptyCell(b)){
      rec.lastName  = String(a==null?'':a).trim().replace(/\s+/g,' ');
      rec.firstName = String(b).trim().replace(/\s+/g,' ');
    } else {
      const sp = splitName(a);
      rec.lastName = sp.lastName; rec.firstName = sp.firstName;
    }
    rec.fullName = fullNameOf(rec);
    if (!rec.code && !rec.fullName) continue;                                   // dòng chỉ có STT
    rows.push(rec);
  }
  if (footerTotal == null) footerTotal = findFooterTotal(aoa, headerRow + 1);
  return { rows, footerTotal, stoppedAt };
}
function validateRows(rows){
  const seen = new Map();
  rows.forEach(r => {
    r.errors = []; r.warns = [];
    if (!r.code) r.errors.push('Thiếu mã SV');
    if (!r.fullName) r.errors.push('Thiếu họ tên');
    if (r.dob){
      const y = Number(r.dob.slice(0,4));
      if (y < 1990 || y > 2015) r.warns.push(`Ngày sinh ${fmtDate(r.dob)} trông không hợp lý`);
    }
    const key = r.code || (noAccent(r.fullName) + '|' + r.dob);
    if (seen.has(key)) r.errors.push('Trùng với dòng ' + seen.get(key));
    else seen.set(key, r._row);
    const exist = S.students.find(s => r.code ? s.code === r.code
      : (noAccent(s.fullName) === noAccent(r.fullName) && (s.dob||'') === (r.dob||'')));
    r.existing = exist || null;
    r.paidFlag = /^da dong/.test(r.status||'');
  });
  return rows;
}

function openImportModal(preFile){

  // Luôn bắt đầu ở bước 0: nếu có file truyền vào (kéo-thả), readFile() sẽ tự chuyển sang bước 1
  // sau khi đọc xong workbook. Vào thẳng bước 1 sẽ vẽ giao diện khớp cột khi wb vẫn còn null.
  let step = 0;
  // CHỦ Ý: import chỉ nhập DANH SÁCH lớp. Cột "Số tiền"/"Trạng thái" trong file chỉ hiển thị để
  // tham khảo, không tạo khoản thu — tiền vào quỹ phải qua chuyển khoản QR hoặc thu tay có người xác nhận.
  let opts = { dedupe:'skip' };

  const m = openModal({
    title:'Nhập danh sách lớp từ Excel', wide:true,
    sub:'Tự dò dòng tiêu đề · tự ghép họ + tên · tự đổi ngày sinh · tự bỏ dòng tổng',
    body:`<div class="steps" style="margin-bottom:.9rem">
        <span class="s" data-s="0"><span class="n">1</span>Chọn file</span><span>→</span>
        <span class="s" data-s="1"><span class="n">2</span>Khớp cột &amp; tuỳ chọn</span><span>→</span>
        <span class="s" data-s="2"><span class="n">3</span>Xem trước &amp; xác nhận</span>
      </div><div id="impBody"></div>`,
    footer:`<span class="left small muted" id="impInfo"></span>
      <button class="btn" data-close>Đóng</button>
      <button class="btn" id="impBack" hidden>Quay lại</button>
      <button class="btn primary" id="impNext" hidden>Tiếp tục</button>`,
    onMount(api){
      const body = api.el('#impBody'), info = api.el('#impInfo');
      const btnNext = api.el('#impNext'), btnBack = api.el('#impBack');

      const setStep = s => {
        step = s;
        api.all('.steps .s').forEach(el => {
          const i = Number(el.dataset.s);
          el.classList.toggle('on', i === s);
          el.classList.toggle('done', i < s);
        });
        btnBack.hidden = s === 0;
        btnNext.hidden = s === 0;
        btnNext.textContent = s === 2 ? 'Xác nhận import' : 'Tiếp tục';
        btnNext.className = 'btn ' + (s === 2 ? 'income' : 'primary');
        draw();
      };
      function draw(){
        if (step === 0) return drawPick();
        if (step === 1) return drawMap();

/**
 * Ghi dữ liệu vào state — thuần nghiệp vụ, KHÔNG chạm giao diện, để bộ tự kiểm tra gọi được
 * mà không làm nhảy trang. Chỉ tạo/cập nhật sinh viên; không bao giờ tạo khoản thu.
 */
function applyImport(ext, opts, meta){
  const batch = { studentIds:[], incomeIds:[], periodId:null, at:new Date().toISOString() };
  let added = 0, updated = 0, skipped = 0, failed = 0;

  ['className','faculty','term','schoolYear'].forEach(k => { if (meta[k]) S.meta[k] = meta[k]; });

  ext.rows.forEach(r => {
    if (r.errors.length){ failed++; return; }
    let student = r.existing;
    if (student){
      if (opts.dedupe === 'skip'){ skipped++; }
      else if (opts.dedupe === 'update'){
        Object.assign(student, { stt:r.stt||student.stt, lastName:r.lastName, firstName:r.firstName,
          fullName:r.fullName, dob:r.dob||student.dob, classCode:r.classCode||student.classCode,
          note:r.note||student.note });
        updated++;
      } else { student = null; }
    }
    if (!student){
      student = { id:uid(), stt:r.stt || (S.students.length+1), code:r.code, lastName:r.lastName,
        firstName:r.firstName, fullName:r.fullName, dob:r.dob, classCode:r.classCode || S.meta.className,
        note:r.note, active:true };
      S.students.push(student); batch.studentIds.push(student.id); added++;
    }
  });
  ui.lastImport = batch;
  return { added, updated, skipped, failed, batch };
}
/** Ghi dữ liệu rồi báo cáo — chỉ chạy khi người dùng bấm "Xác nhận import". */
function doImport(api, ext, opts, meta){
  const { added, updated, skipped, failed } = applyImport(ext, opts, meta);
  save();
  api.close();
  go('students');
  openModal({
    title:'Import xong', mw:520,
    body:`<div class="okbox" style="margin-bottom:.8rem">Đọc được <b>${ext.rows.length}</b> dòng dữ liệu từ file.</div>
      <table><tbody>
        <tr><td>Thêm mới</td><td class="r"><b>${added}</b> sinh viên</td></tr>
        <tr><td>Cập nhật</td><td class="r"><b>${updated}</b></td></tr>
        <tr><td>Bỏ qua (đã có)</td><td class="r"><b>${skipped}</b></td></tr>
        <tr><td>Lỗi</td><td class="r"><b>${failed}</b></td></tr>
      </tbody></table>
      <div class="warnbox" style="margin-top:.8rem"><span>→</span><span>Bước tiếp theo: tạo <b>đợt thu</b>
        (mức thu mỗi SV, thuộc Quỹ Lớp hay Quỹ Đoàn), rồi bấm <b>“QR cả lớp”</b> để mỗi sinh viên quét mã
        chuyển khoản đúng số tiền của mình.</span></div>`,
    footer:`<button class="btn danger left" id="undoImp">Hoàn tác lần import này</button>
            <button class="btn primary" data-close data-autofocus>Xong</button>`,
    onMount(m2){ m2.el('#undoImp').onclick = () => { m2.close(); undoImport(); }; }

  toast('ok', `Đã import ${added} sinh viên`, 'Tạo đợt thu rồi dùng QR để thu tiền.');
}

  const b = ui.lastImport;
  if (!b) return toast('err','Không có lần import nào để hoàn tác');
  confirmDialog({

/* ==========================================================================
   EXPORT — workbook nhiều sheet
   ========================================================================== */
function scopeLabel(sc){
  if (sc.mode === 'all')   return 'Tất cả';
  if (sc.mode === 'day')   return 'Ngày ' + fmtDate(sc.from);
  return `${fmtDate(sc.from)} → ${fmtDate(sc.to)}`;
}
function scopeFileTag(sc){
  if (sc.mode === 'all') return 'TatCa';
  if (sc.mode === 'day') return (sc.from||'').replace(/-/g,'');
  return (sc.from||'').replace(/-/g,'') + '-' + (sc.to||'').replace(/-/g,'');
}
/** Lọc bản ghi theo phạm vi xuất — dùng chung cho mọi sheet và cho bộ tự kiểm tra. */
function scopeFilter(rows, sc){
  return rows.filter(r => {
    if (sc.fund && r.fund !== sc.fund) return false;
    if (sc.mode === 'day')   return r.date === sc.from;
    if (sc.mode === 'range') return (!sc.from || r.date >= sc.from) && (!sc.to || r.date <= sc.to);
    return true;
  });
}
/** Tạo worksheet: cột tiền ghi số thật + format #,##0 để Excel SUM được; ngày ghi kiểu ngày. */
function mkSheet(aoa, o){
  o = o || {};
  const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates:true });
  const money = o.money || [], dates = o.dates || [];
  const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
  for (let R = range.s.r; R <= range.e.r; R++){
    money.forEach(C => { const c = ws[XLSX.utils.encode_cell({r:R,c:C})]; if (c && c.t === 'n') c.z = '#,##0'; });
    dates.forEach(C => { const c = ws[XLSX.utils.encode_cell({r:R,c:C})];
      if (c && (c.t === 'd' || (c.t === 'n' && R > (o.headerRow||0)))) c.z = 'dd/mm/yyyy'; });
  }
  ws['!cols'] = (o.widths || aoa[o.headerRow||0] || []).map((h,i) => {
    if (o.widths) return { wch: o.widths[i] };
    const len = Math.max(String(h==null?'':h).length + 2,
      ...aoa.slice(1, 60).map(r => String((r||[])[i]==null?'':(r||[])[i]).length + 2));
    return { wch: Math.min(Math.max(len, 8), 42) };
  });
  if (o.autofilter && aoa.length > 1){
    const hr = o.headerRow || 0;
    ws['!autofilter'] = { ref: XLSX.utils.encode_range(
      { r:hr, c:0 }, { r: aoa.length-1, c: Math.max((aoa[hr]||[]).length-1, 0) }) };
  }
  return ws;
}
/**
 * ISO 'YYYY-MM-DD' → serial Excel (số nguyên, hệ 1900, gốc 1899-12-30).
 * Tự tính thay vì đưa Date object cho SheetJS: SheetJS quy đổi theo offset múi giờ
 * *lịch sử* của năm 1899 (Asia/Bangkok là +6:59:56) nên ô ngày bị dính phần thập phân
 * 0.0000463 ≈ 4 giây. Ghi số nguyên + format 'dd/mm/yyyy' là chính xác và không phụ thuộc máy.
 */
function isoToSerial(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));
  if (!m) return '';
  return Math.round((Date.UTC(+m[1], +m[2]-1, +m[3]) - Date.UTC(1899,11,30)) / 86400000);
}
const toDate = iso => isoToSerial(iso);

  /* 1. Tong quan */

  t.push(['BÁO CÁO THU CHI QUỸ LỚP']);
  t.push(['Lớp', S.meta.className || '', '', 'Khoa', S.meta.faculty || '']);
  t.push(['Học kỳ', S.meta.term || '', '', 'Năm học', S.meta.schoolYear || '']);
  t.push(['Phạm vi xuất', scopeLabel(sc), '', 'Quỹ', sc.fund ? FUNDS[sc.fund].label : 'Cả ' + FUND_KEYS.length + ' quỹ']);
  t.push(['Xuất lúc', new Date().toLocaleString('vi-VN')]);
  t.push([]);
  t.push(['Chỉ tiêu', ...funds.map(f=>FUNDS[f].label), 'Tổng cộng']);
  const rowIncome  = funds.map(f => sum(inc,f));
  const rowExpense = funds.map(f => sum(exp,f));
  t.push(['Tổng thu',  ...rowIncome,  rowIncome.reduce((a,b)=>a+b,0)]);
  t.push(['Tổng chi',  ...rowExpense, rowExpense.reduce((a,b)=>a+b,0)]);
  t.push(['Tồn quỹ',   ...funds.map((f,i)=>rowIncome[i]-rowExpense[i]),
                       rowIncome.reduce((a,b)=>a+b,0) - rowExpense.reduce((a,b)=>a+b,0)]);
  if (sc.mode !== 'all'){
    t.push([]);
    t.push(['Tồn quỹ luỹ kế toàn thời gian', ...funds.map(f=>lifetimeBalance(f)),
            funds.reduce((a,f)=>a+lifetimeBalance(f),0)]);
    t.push(['(Đây là số tiền lớp thực tế đang giữ, không phụ thuộc phạm vi lọc)']);
  }
  XLSX.utils.book_append_sheet(wb, mkSheet(t, { money:[1,2,3], headerRow:6, widths:[34,18,18,18,18] }), 'Tong quan');

  /* 2. Thu */
  const hThu = ['Ngày','Quỹ','Đợt thu','Mã SV','Họ và tên','Số tiền','Hình thức','Người thu','Ghi chú'];
  const aThu = inc.length ? [hThu, ...inc.map(i => {
    const s = i.studentId ? studentById(i.studentId) : null;
    return [toDate(i.date), FUNDS[i.fund].label, periodById(i.periodId)?.name || 'Ngoài đợt',
      s ? s.code : '', s ? s.fullName : (i.payerName || 'Nguồn khác'), int(i.amount),
      METHODS[i.method] || '', i.collectedBy || '', i.note || ''];
  }), [], ['TỔNG CỘNG','','','','', inc.reduce((a,x)=>a+int(x.amount),0)],
     ...funds.map(f => ['Trong đó ' + FUNDS[f].label,'','','','', sum(inc,f)])] : [hThu, ...NO_DATA];
  XLSX.utils.book_append_sheet(wb, mkSheet(aThu, { money:[5], dates:[0], autofilter:true }), 'Thu');

  /* 3. Chi */
  const hChi = ['Ngày','Rút từ quỹ','Nội dung / Mua món gì','Danh mục','Người đi mua','Số tiền','Có hoá đơn','Vượt quỹ','Ghi chú'];
  const aChi = exp.length ? [hChi, ...exp.map(e => [toDate(e.date), FUNDS[e.fund].label, e.item,
      e.category || '', e.buyer || '', int(e.amount), e.hasReceipt ? 'Có' : 'Không',
      e.overdraft ? 'CÓ' : '', e.note || '']),
    [], ['TỔNG CỘNG','','','','', exp.reduce((a,x)=>a+int(x.amount),0)],
    ...funds.map(f => ['Trong đó ' + FUNDS[f].label,'','','','', sum(exp,f)])] : [hChi, ...NO_DATA];
  XLSX.utils.book_append_sheet(wb, mkSheet(aChi, { money:[5], dates:[0], autofilter:true }), 'Chi');

  /* 4. Cong no */
  const periods = S.periods.filter(p => !sc.fund || p.fund === sc.fund);
  const dm = debtMatrix();
  const hNo = ['STT','Mã SV','Họ và tên','Lớp', ...periods.map(p=>`${p.name} (${FUNDS[p.fund].short})`),
               'Phải nộp','Đã nộp','Còn thiếu','Trạng thái'];
  const aNo = [hNo, ...dm.map(r => {
    const cells = periods.map(p => { const c = r.cells.find(x=>x.period.id===p.id); return c ? c.paid : 0; });
    const must = periods.reduce((a,p)=>a+int(p.amountPerStudent),0);
    const paid = cells.reduce((a,b)=>a+b,0);
    return [r.student.stt || '', r.student.code, r.student.fullName, r.student.classCode || '',
      ...cells, must, paid, Math.max(must-paid,0), paid >= must ? 'Đã đủ' : paid > 0 ? 'Còn thiếu' : 'Chưa nộp'];
  })];
  XLSX.utils.book_append_sheet(wb, mkSheet(aNo, {
    money: periods.map((_,i)=>4+i).concat([4+periods.length, 5+periods.length, 6+periods.length]), autofilter:true }), 'Cong no');

  /* 5. Ma tran dot thu */
  const hMt = ['Mã SV','Họ và tên', ...periods.map(p=>p.name)];
  const aMt = [hMt, ...dm.map(r => [r.student.code, r.student.fullName, ...periods.map(p => {
    const c = r.cells.find(x=>x.period.id===p.id);
    if (!c || int(c.must) === 0) return '—';
    return c.status === 'paid' ? 'Đã đóng' : c.status === 'partial' ? 'Thiếu ' + fmtNum(c.remaining) : 'Chưa đóng';
  })])];
  XLSX.utils.book_append_sheet(wb, mkSheet(aMt, { autofilter:true }), 'Ma tran dot thu');

  /* 6. Danh sach lop — xuất ra để tái import được */
  const hDs = ['STT','Mã SV','Họ và tên đệm','Tên','Ngày sinh','Lớp','Ghi chú','Còn học'];
  const aDs = [hDs, ...S.students.map(s => [s.stt || '', s.code, s.lastName, s.firstName,
    toDate(s.dob), s.classCode || '', s.note || '', s.active === false ? 'Không' : 'Có'])];
  XLSX.utils.book_append_sheet(wb, mkSheet(aDs, { dates:[4], autofilter:true }), 'Danh sach lop');

  /* 7. Nhat ky theo ngay — có số dư luỹ kế của từng quỹ */
  const led = dailyLedger(null).filter(r => (!sc.fund || r.fund === sc.fund) &&
    (sc.mode === 'all' ? true : sc.mode === 'day' ? r.date === sc.from
      : (!sc.from || r.date >= sc.from) && (!sc.to || r.date <= sc.to)));
  const hNk = ['Ngày','Loại','Quỹ','Nội dung / Người nộp','Chi tiết','Số tiền thu','Số tiền chi','Số dư luỹ kế của quỹ'];
  const aNk = led.length ? [hNk, ...led.map(r => [toDate(r.date), r.kind === 'THU' ? 'Thu' : 'Chi',
    FUNDS[r.fund].label, r.label, r.extra || '',
    r.kind === 'THU' ? r.amount : '', r.kind === 'CHI' ? r.amount : '', r.running])] : [hNk, ...NO_DATA];
  XLSX.utils.book_append_sheet(wb, mkSheet(aNk, { money:[5,6,7], dates:[0], autofilter:true }), 'Nhat ky theo ngay');

  /* 8. QR chuyen khoan — để đối chiếu sao kê ngân hàng với từng sinh viên */
  if (bankConfigured() && periods.length){
    const b = S.meta.bank;
    const hQr = ['Mã SV','Họ và tên','Đợt thu','Quỹ','Còn phải nộp','Nội dung chuyển khoản',
                 'Ngân hàng','Số tài khoản','Nội dung mã QR (VietQR)'];
    const aQr = [hQr];
    periods.forEach(p => {
      S.students.filter(st => st.active !== false).forEach(st => {
        const remaining = Math.max(int(p.amountPerStudent) - paidOf(st.id, p.id), 0);
        if (!remaining) return;
        const note = transferNote(st, p);
        aQr.push([st.code, st.fullName, p.name, FUNDS[p.fund].label, remaining, note,
          b.bankName || b.bin, b.accountNo,
          buildVietQR({ bin:b.bin, accountNo:b.accountNo, amount:remaining, description:note })]);
      });
    });
    if (aQr.length === 1) aQr.push(['Cả lớp đã nộp đủ, không còn ai cần chuyển khoản']);
    XLSX.utils.book_append_sheet(wb, mkSheet(aQr, { money:[4], autofilter:true }), 'QR chuyen khoan');
  }

  return wb;
}
function openExportModal(mode){
  let sc = { mode: mode || 'all', from: todayISO(), to: todayISO(), fund: '' };
  openModal({
    title:'Xuất Excel', mw:560,
    sub:'Workbook gồm: Tổng quan · Thu · Chi · Công nợ · Ma trận đợt thu · Danh sách lớp · Nhật ký theo ngày'
      + (bankConfigured() ? ' · QR chuyển khoản' : ''),
    body:`<div class="field"><label>Phạm vi</label><div class="chips">
        ${[['all','Tất cả'],['range','Theo khoảng ngày'],['day','Theo một ngày']]
          .map(([v,l])=>`<button type="button" class="chip ${sc.mode===v?'on':''}" data-sc="${v}">${l}</button>`).join('')}
      </div></div>
      <div id="scDates"></div>
      <div class="field"><label for="scFund">Quỹ</label><select id="scFund">
        <option value="">Cả ${FUND_KEYS.length} quỹ (tách cột riêng)</option>
        ${FUND_KEYS.map(k=>`<option value="${k}">Chỉ ${esc(FUNDS[k].label)}</option>`).join('')}
      </select></div>
      <div class="small muted" id="scInfo"></div>`,
    footer:`<button class="btn" data-close>Huỷ</button><button class="btn primary" id="scGo">Tải file .xlsx</button>`,
    onMount(m){
      const drawDates = () => {
        const box = m.el('#scDates');
        box.innerHTML = sc.mode === 'range'
          ? `<div class="f2"><div class="field"><label for="scFrom">Từ ngày</label><input type="date" id="scFrom" value="${sc.from}"></div>
             <div class="field"><label for="scTo">Đến ngày</label><input type="date" id="scTo" value="${sc.to}"></div></div>`
          : sc.mode === 'day'
          ? `<div class="field" style="max-width:220px"><label for="scFrom">Ngày</label><input type="date" id="scFrom" value="${sc.from}"></div>` : '';
        const f = m.el('#scFrom'), t2 = m.el('#scTo');
        if (f) f.onchange = () => { sc.from = f.value; info(); };
        if (t2) t2.onchange = () => { sc.to = t2.value; info(); };
        info();
      };
      const info = () => {
        const i = scopeFilter(S.incomes, sc).length, e = scopeFilter(S.expenses, sc).length;
        m.el('#scInfo').innerHTML = `Phạm vi này có <b>${i}</b> khoản thu và <b>${e}</b> khoản chi.`;
      };
      m.all('[data-sc]').forEach(b => b.onclick = () => {
        sc.mode = b.dataset.sc;
        m.all('[data-sc]').forEach(x => x.classList.toggle('on', x.dataset.sc === sc.mode));
        drawDates();
      });
      m.el('#scFund').onchange = e => { sc.fund = e.target.value; info(); };
      drawDates();
      m.el('#scGo').onclick = () => {
        if (typeof XLSX === 'undefined') return toast('err','Chưa tải được thư viện Excel','Kiểm tra kết nối mạng rồi mở lại trang.');
        if (sc.mode === 'range' && sc.from && sc.to && sc.from > sc.to)
          return toast('err','Khoảng ngày không hợp lệ','“Từ ngày” phải trước “Đến ngày”.');
        try {
          const wb = buildWorkbook(sc);
          const name = `ClassFund_${(S.meta.className||'lop').replace(/\s+/g,'')}_${scopeFileTag(sc)}_${stampNow()}.xlsx`;
          XLSX.writeFile(wb, name);
          m.close();
          toast('ok','Đã xuất Excel', name);
        } catch(err){ toast('err','Xuất Excel thất bại', err.message); }
      };
    }
  });
}

/* ==========================================================================
   SELFTEST — chạy trên dữ liệu giả, không ảnh hưởng dữ liệu thật
   ========================================================================== */
function runSelfTest(){
  const out = [];
  const t = (name, fn) => {
    try { const r = fn(); out.push({ ok: r === true, name, msg: r === true ? '' : String(r) }); }
    catch(e){ out.push({ ok:false, name, msg:'Lỗi: ' + e.message }); }
  };
  const real = S;                                     // giữ dữ liệu thật, chạy test trên sandbox
  const eq = (a,b,label) => a === b ? true : `${label}: nhận ${a}, mong đợi ${b}`;

  t('Tồn quỹ = Tổng thu − Tổng chi (từng quỹ), đúng sau thêm/sửa/xoá', () => {
    S = emptyState();
    S.periods.push({ id:'p1', name:'P1', fund:'QUY_LOP', amountPerStudent:50000, openDate:'2026-09-01', status:'OPEN' });
    S.incomes.push({ id:'i1', date:'2026-09-02', fund:'QUY_LOP', periodId:'p1', studentId:null, payerName:'A', amount:100000 });
    S.expenses.push({ id:'e1', date:'2026-09-03', fund:'QUY_LOP', item:'Nước', buyer:'B', amount:30000 });
    if (lifetimeBalance('QUY_LOP') !== 70000) return 'sau khi thêm: ' + lifetimeBalance('QUY_LOP');
    S.incomes[0].amount = 120000;                                        // sửa
    if (lifetimeBalance('QUY_LOP') !== 90000) return 'sau khi sửa: ' + lifetimeBalance('QUY_LOP');
    S.expenses.splice(0,1);                                              // xoá
    return eq(lifetimeBalance('QUY_LOP'), 120000, 'sau khi xoá');
  });
  t('Thu vào Quỹ Đoàn không làm đổi tồn Quỹ Lớp (và ngược lại)', () => {
    S = emptyState();
    S.incomes.push({ id:'i1', date:'2026-09-02', fund:'QUY_LOP',  amount:100000, payerName:'A' });
    S.incomes.push({ id:'i2', date:'2026-09-02', fund:'QUY_DOAN', amount:70000,  payerName:'B' });
    S.expenses.push({ id:'e1', date:'2026-09-04', fund:'QUY_DOAN', item:'Cờ', buyer:'C', amount:20000 });
    if (lifetimeBalance('QUY_LOP') !== 100000) return 'Quỹ Lớp bị ảnh hưởng: ' + lifetimeBalance('QUY_LOP');
    return eq(lifetimeBalance('QUY_DOAN'), 50000, 'Quỹ Đoàn');
  });
  t('Mã SV dạng số/khoa học → chuỗi nguyên', () => {
    const cases = [['2.400000001E9','2400000001'], [2400000001,'2400000001'],
                   ['2400000001.0','2400000001'], ['0240000001','0240000001']];
    for (const [i,o] of cases){ const got = normCode(i); if (got !== o) return `normCode(${i}) = ${got}, mong đợi ${o}`; }
    return true;
  });
  t('Serial Excel → ngày (hệ 1900, gốc 1899-12-30)', () => {
    const cases = [[38918,'2006-07-20'], [38873,'2006-06-05'], [38399,'2005-02-16'], [39077,'2006-12-26']];
    for (const [i,o] of cases){ const got = excelSerialToISO(i); if (got !== o) return `${i} → ${got}, mong đợi ${o}`; }
    return true;
  });
  t('Ô ngày kiểu Date lệch vài giây trước nửa đêm vẫn ra đúng ngày', () => {
    const d = new Date(2006, 6, 20, 0, 0, 0);            // 20/07/2006 00:00 giờ địa phương
    d.setSeconds(d.getSeconds() - 4);                     // → 19/07/2006 23:59:56 (kiểu SheetJS trả về)
    const got = parseDateFlexible(d);
    return got === '2006-07-20' ? true : `nhận ${got}, mong đợi 2006-07-20`;
  });
  t('Import file mẫu: đọc đúng 49 SV, không lấy dòng "Tổng quỹ"', () => {
    S = emptyState();
    const aoa = fakeClassSheet();
    const hr = detectHeaderRow(aoa);
    if (hr !== 9) return 'dò dòng tiêu đề ra dòng ' + (hr+1) + ', mong đợi dòng 10';
    const mapping = {}; (aoa[hr]||[]).forEach((h,c) => mapping[c] = guessField(h));
    mapping[3] = 'firstName';
    const ex = extractRows(aoa, hr, mapping);
    if (ex.rows.length !== 49) return 'đọc được ' + ex.rows.length + ' dòng, mong đợi 49';
    if (ex.rows.some(r => noAccent(r.fullName).startsWith('tong'))) return 'dòng tổng bị lẫn vào danh sách';
    if (ex.footerTotal !== 1000000) return 'không đọc được dòng tổng để đối chiếu: ' + ex.footerTotal;
    if (ex.rows[0].code !== '2400000001') return 'mã SV dòng đầu = ' + ex.rows[0].code;
    if (ex.rows[0].fullName !== 'Trần Văn Mẫu') return 'ghép họ tên sai: ' + ex.rows[0].fullName;
    if (ex.rows[0].dob !== '2006-07-20') return 'ngày sinh dòng đầu = ' + ex.rows[0].dob;
    return true;
  });
  t('Import lại lần 2 với chế độ "Bỏ qua trùng" → vẫn 49 SV', () => {
    S = emptyState();
    const aoa = fakeClassSheet(), hr = detectHeaderRow(aoa);
    const mapping = {}; (aoa[hr]||[]).forEach((h,c) => mapping[c] = guessField(h)); mapping[3] = 'firstName';
    const push = () => {
      const ex = extractRows(aoa, hr, mapping); validateRows(ex.rows);
      ex.rows.forEach(r => { if (!r.errors.length && !r.existing)
        S.students.push({ id:uid(), code:r.code, lastName:r.lastName, firstName:r.firstName,
                          fullName:r.fullName, dob:r.dob, active:true }); });
    };
    push(); const first = S.students.length; push();
    if (first !== 49) return 'lần 1 được ' + first + ' SV';
    return eq(S.students.length, 49, 'sau lần 2');
  });
  t('Xuất theo một ngày chỉ chứa bản ghi của ngày đó', () => {
    S = emptyState();
    S.incomes.push({ id:'a', date:'2026-09-05', fund:'QUY_LOP', amount:50000, payerName:'A' });
    S.incomes.push({ id:'b', date:'2026-09-06', fund:'QUY_LOP', amount:50000, payerName:'B' });
    S.expenses.push({ id:'c', date:'2026-09-05', fund:'QUY_DOAN', item:'X', buyer:'Y', amount:10000 });
    const sc = { mode:'day', from:'2026-09-05', fund:'' };
    const i = scopeFilter(S.incomes, sc), e = scopeFilter(S.expenses, sc);
    if (i.length !== 1 || i[0].id !== 'a') return 'thu lọc ra ' + i.length + ' dòng';
    return eq(e.length, 1, 'chi lọc ra');
  });
  t('Tổng còn thiếu = Σ(số SV × mức thu) − Σ đã nộp, đúng theo từng quỹ', () => {
    S = emptyState();
    S.periods.push({ id:'p1', name:'Lớp', fund:'QUY_LOP',  amountPerStudent:50000, openDate:'2026-09-01', status:'OPEN' });
    S.periods.push({ id:'p2', name:'Đoàn', fund:'QUY_DOAN', amountPerStudent:20000, openDate:'2026-09-01', status:'OPEN' });
    for (let k = 0; k < 5; k++) S.students.push({ id:'s'+k, code:'c'+k, lastName:'SV', firstName:''+k, fullName:'SV '+k, active:true });
    S.incomes.push({ id:'i1', date:'2026-09-02', fund:'QUY_LOP',  periodId:'p1', studentId:'s0', amount:50000 });
    S.incomes.push({ id:'i2', date:'2026-09-02', fund:'QUY_LOP',  periodId:'p1', studentId:'s1', amount:20000 });
    S.incomes.push({ id:'i3', date:'2026-09-02', fund:'QUY_DOAN', periodId:'p2', studentId:'s0', amount:20000 });
    const st1 = periodStats(S.periods[0]), st2 = periodStats(S.periods[1]);
    if (st1.remaining !== 5*50000 - 70000) return 'Quỹ Lớp còn thiếu = ' + st1.remaining;
    if (st1.paidCount !== 1 || st1.partialCount !== 1 || st1.unpaidCount !== 3)
      return `Quỹ Lớp: ${st1.paidCount} đủ / ${st1.partialCount} thiếu / ${st1.unpaidCount} chưa`;
    return eq(st2.remaining, 5*20000 - 20000, 'Quỹ Đoàn còn thiếu');
  });
  t('CRC16/CCITT-FALSE đúng chuẩn EMVCo', () =>
    crc16('123456789') === '29B1' ? true : `crc16('123456789') = ${crc16('123456789')}, mong đợi 29B1`);
  t('Payload VietQR đúng cấu trúc và CRC tự kiểm', () => {
    const p = buildVietQR({ bin:'970436', accountNo:'1021234567', amount:50000, description:'2400000001 QUY LOP' });
    const parse = str => { const out = {}; let i = 0;
      while (i < str.length){ const id = str.substr(i,2), len = +str.substr(i+2,2); out[id] = str.substr(i+4,len); i += 4+len; }
      return out; };
    const f = parse(p);
    if (f['00'] !== '01') return 'thiếu phiên bản';
    if (f['01'] !== '12') return 'QR có số tiền phải là kiểu 12, nhận ' + f['01'];
    if (f['53'] !== '704') return 'tiền tệ phải là 704 (VND)';
    if (f['54'] !== '50000') return 'số tiền trong QR = ' + f['54'];
    if (f['58'] !== 'VN') return 'thiếu mã quốc gia';
    const acc = parse(parse(f['38'])['01']);
    if (acc['00'] !== '970436' || acc['01'] !== '1021234567') return 'sai BIN/số tài khoản: ' + JSON.stringify(acc);
    if (parse(f['38'])['02'] !== 'QRIBFTTA') return 'thiếu mã dịch vụ chuyển khoản';
    return p.slice(-4) === crc16(p.slice(0,-4)) ? true : 'CRC cuối payload không khớp';
  });
  t('QR không có số tiền là mã tĩnh (kiểu 11), không có trường 54', () => {
    const p = buildVietQR({ bin:'970436', accountNo:'1021234567' });
    const f = {}; let i = 0;
    while (i < p.length){ const id = p.substr(i,2), len = +p.substr(i+2,2); f[id] = p.substr(i+4,len); i += 4 + len; }
    if (f['01'] !== '11') return 'kiểu QR = ' + f['01'] + ', mong đợi 11';
    return f['54'] === undefined ? true : 'vẫn có trường số tiền: ' + f['54'];
  });
  t('Chưa cấu hình tài khoản thì không sinh QR', () =>
    buildVietQR({ bin:'', accountNo:'' }) === '' && buildVietQR({ bin:'97043', accountNo:'123' }) === ''
      ? true : 'vẫn sinh ra payload dù thiếu cấu hình');
  t('Nội dung chuyển khoản: bỏ dấu, in hoa, tối đa 25 ký tự', () => {
    const n = cleanTransferNote('Trần Văn Mẫu – Quỹ lớp học kỳ I (2026)');
    if (/[^A-Z0-9 ]/.test(n)) return 'còn ký tự lạ: ' + n;
    if (n.length > 25) return 'dài ' + n.length + ' ký tự';
    return n === n.trim() ? true : 'còn khoảng trắng ở đầu/cuối: "' + n + '"';
  });
  t('Import KHÔNG tự tạo khoản thu từ cột Số tiền trong file', () => {
    S = emptyState();
    const aoa = fakeClassSheet(), hr = detectHeaderRow(aoa);
    const mapping = {}; (aoa[hr]||[]).forEach((h,c) => mapping[c] = guessField(h)); mapping[3] = 'firstName';
    const ex = extractRows(aoa, hr, mapping); validateRows(ex.rows);
    const hasMoneyInFile = ex.rows.some(r => r.amount > 0);
    applyImport(ex, { dedupe:'skip' }, {});
    if (!hasMoneyInFile) return 'file mẫu phải có cột số tiền để phép kiểm tra này có ý nghĩa';
    if (S.incomes.length !== 0) return 'đã tạo ' + S.incomes.length + ' khoản thu từ file';
    return S.students.length === 49 ? true : 'nhập được ' + S.students.length + ' SV';
  });
  t('Nhập tiền "50.000" và "50000" cho cùng một giá trị', () =>
    parseMoney('50.000') === 50000 && parseMoney('50000') === 50000 && parseMoney('50 000 ₫') === 50000
      ? true : 'parseMoney sai');
  t('Tìm kiếm bỏ dấu khớp tên có dấu', () =>
    noAccent('Trần Văn Mẫu') === 'tran van mau' && noAccent('Đặng Văn Bảy') === 'dang van bay'
      ? true : 'noAccent sai: ' + noAccent('Trần Văn Mẫu'));

  S = real;                                            // trả lại dữ liệu thật
  const pass = out.filter(o=>o.ok).length;
  return `<div class="${pass===out.length?'okbox':'warnbox'}" style="margin-bottom:.6rem">
      <b>${pass}/${out.length} phép kiểm tra đạt</b>${pass===out.length?' — số liệu tính toán đúng như đặc tả.':''}</div>
    ${out.map(o=>`<div class="testline ${o.ok?'p':'f'}"><span class="st">${o.ok?'✓ ĐẠT':'✕ LỖI'}</span>
      <span>${esc(o.name)}${o.msg?` <span style="color:var(--expense)">— ${esc(o.msg)}</span>`:''}</span></div>`).join('')}`;
}
/** Dựng lại đúng hình dạng file thật để test parser (9 dòng tiêu đề · tên tách 2 cột · serial ngày · dòng tổng). */
function fakeClassSheet(){
  const rows = [
    ['BỘ GIÁO DỤC VÀ ĐÀO TẠO', null, null, null, null, null, null, null, null, 'CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM'],
    ['TRƯỜNG ĐẠI HỌC MỎ - ĐỊA CHẤT', null, null, null, null, null, null, null, null, 'Độc lập - Tự do - Hạnh phúc'],
    [], [null,null,null,null,null,null,null,null,null,null,null,'Hà Nội, ngày tháng năm 2026'], [],
    ['DANH SÁCH ĐÓNG GÓP QUỸ LỚP HỌC KỲ I - NĂM HỌC 2026-2027'],
    ['KHOA: XÂY DỰNG - LỚP: DCXDXD69_03B'],
    [], [],
    ['STT','Mã SV','Họ và tên SV', null,'Ngày sinh','Lớp ','Trạng thái','Số tiền ','Ngày','Mua','Phát sinh','Tổng tiền còn lại ','Tiền thiếu '],
  ];
  const names = [['Trần Văn','Mẫu',38918],['Lê Thị','Thử',38873],['Hoàng Văn','Bốn',38515],['Bùi Văn','Năm',38746]];
  for (let k = 0; k < 49; k++){
    const n = names[k % names.length];
    rows.push([k+1, 2400000001 + k, n[0], n[1] + (k>3?('_'+k):''), n[2] + k, 'DCXDXD69_03B',
               k % 2 ? 'Đã đóng ' : 'Chưa đóng ', k % 2 ? 50000 : null]);
  }
  rows.push([], [], ['Tổng quỹ :', null, null, null, null, null, null, 1000000]);
  return rows;
}

/* ==========================================================================
   INIT
   ========================================================================== */
function initEvents(){
  document.querySelectorAll('.nav-item').forEach(b => b.onclick = () => go(b.dataset.view));
  byId('btnAddIncome').onclick  = () => openIncomeModal();
  byId('btnAddExpense').onclick = () => openExpenseModal();
  byId('btnTheme').onclick = () => {
    P.theme = P.theme === 'auto' ? 'light' : P.theme === 'light' ? 'dark' : 'auto';
    applyPrefs();
    toast('ok','Giao diện: ' + ({ light:'Sáng', dark:'Tối', auto:'Theo hệ thống' })[P.theme], '', 1800);
    if (ui.view === 'settings') render();
  };
  const burger = byId('burger');
  burger.onclick = () => {
    const side = byId('side'), open = !side.classList.contains('open');
    side.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', String(open));
    document.querySelector('.scrim')?.remove();
    if (open){
      const sc = document.createElement('div');
      sc.className = 'scrim';
      sc.onclick = () => { side.classList.remove('open'); sc.remove(); burger.setAttribute('aria-expanded','false'); };
      document.body.appendChild(sc);
    }
  };
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (byId('modalRoot').children.length) return;
    if (typing) return;
    if (e.key === 't' || e.key === 'T'){ e.preventDefault(); openIncomeModal(); }
    else if (e.key === 'c' || e.key === 'C'){ e.preventDefault(); openExpenseModal(); }
    else if (e.key === '/'){
      e.preventDefault();
      if (ui.view !== 'students') go('students');
      setTimeout(()=>byId('q')?.focus(), 80);
    }
  });
  // dự phòng nếu CDN chính bị chặn
  if (typeof XLSX === 'undefined'){
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    document.head.appendChild(s);
  }
}
