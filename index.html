<!--
  =====================================================================================
  CLASS FUND — HỆ THỐNG QUẢN LÝ TÀI CHÍNH LỚP HỌC (ALL-IN-ONE, 1 FILE)
  =====================================================================================
  KIẾN TRÚC
    Toàn bộ app nằm trong file này. Không build, không npm. Mở bằng double-click là chạy.
    Thư viện ngoài duy nhất: SheetJS (xlsx) qua CDN — chỉ dùng cho import/export Excel.
    Dữ liệu lưu ở localStorage, key `classFund.v1`.

  CÁC KHỐI CODE (tìm theo mốc ==== trong <script>)
    STATE     — khai báo hằng số, state gốc, migrate
    STORAGE   — load/save localStorage, sao lưu & phục hồi JSON
    UTILS     — tiền, ngày, bỏ dấu tiếng Việt, quy đổi serial Excel
    COMPUTE   — tính tổng thu/chi/tồn quỹ, công nợ (nguồn sự thật duy nhất)
    RENDER    — vẽ từng trang
    EVENTS    — form, modal, phím tắt
    QR        — dựng payload VietQR (Napas 247) + vẽ QR cho từng sinh viên
    IMPORT    — đọc file Excel danh sách lớp (5 bẫy của file thật, xem §IMPORT)
    EXPORT    — xuất workbook nhiều sheet
    SELFTEST  — bộ tự kiểm tra

  SƠ ĐỒ DỮ LIỆU
    meta      { className, faculty, term, schoolYear, ... }
    students  [{ id, stt, code, lastName, firstName, fullName, dob, classCode, note, active }]
    periods   [{ id, name, fund, amountPerStudent, openDate, dueDate, status, note }]
    incomes   [{ id, date, fund, periodId, studentId, payerName, amount, method, collectedBy, note }]
    expenses  [{ id, date, fund, item, category, buyer, amount, hasReceipt, note }]

  NGUYÊN TẮC BẤT DI BẤT DỊCH
    1. Hai quỹ QUY_LOP / QUY_DOAN tách biệt tuyệt đối. Mọi bản ghi phải gắn đúng 1 quỹ.
    2. Tiền là số nguyên VND. Không float, không chia 1000, không âm.
    3. Tồn quỹ LUÔN tính lại từ bản ghi: Tồn(X) = Σ Thu(X) − Σ Chi(X). Không có ô nhập tay.
    4. Tiền vào quỹ chỉ được ghi nhận khi có người xác nhận đã nhận: chuyển khoản QR hoặc thu tay.
       KHÔNG lấy cột "Số tiền"/"Trạng thái" trong file Excel để tự tạo khoản thu — file chỉ dùng
       để nhập DANH SÁCH lớp.

  MUỐN THÊM QUỸ THỨ 3?
    Sửa duy nhất hằng số FUNDS ở đầu khối STATE (thêm 1 entry: mã, nhãn, biến màu CSS)
    và thêm 2 biến màu --fund-xxx / --fund-xxx-soft trong :root + khối dark mode.
    Mọi chỗ khác (dashboard, export, báo cáo) đều lặp theo Object.keys(FUNDS) nên tự chạy.
  =====================================================================================
-->

<style>
/* ============================== TOKENS ============================== */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f1f3f9; --surface-3:#e9ecf4;
  --border:#e2e6f0; --border-strong:#cdd4e3;
  --text:#131722; --text-2:#454c5e; --text-3:#6b7280;
  --brand:#4f46e5; --brand-soft:#eeeffe; --brand-text:#3730a3;
  --fund-lop:#4f46e5;  --fund-lop-soft:#ecedfd;  --fund-lop-text:#312e81;
  --fund-doan:#b45309; --fund-doan-soft:#fdf0e0; --fund-doan-text:#7c3d05;
  --income:#0e7a4d; --income-soft:#e5f6ee;
  --expense:#c0273b; --expense-soft:#fdebee;
  --warn:#a35a06; --warn-soft:#fdf2e3;
  --focus:#2563eb;
  --radius:14px; --radius-sm:10px; --radius-xs:7px;
  --shadow-1:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
  --shadow-2:0 14px 38px -10px rgba(16,24,40,.22), 0 4px 10px rgba(16,24,40,.06);
  /* motion tokens — MỌI animation phải lấy từ đây, không gõ số rời rạc */
  --dur-instant:.09s; --dur-fast:.14s; --dur:.2s; --dur-slow:.32s; --dur-page:.42s;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.4,0,1,1); --ease-io:cubic-bezier(.4,0,.2,1);
  --font-ui:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;
  --font-head:'Lexend','Be Vietnam Pro',system-ui,sans-serif;
  --fs-scale:1;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0e1016; --surface:#171a22; --surface-2:#1d212b; --surface-3:#252a36;
  --border:#272c38; --border-strong:#39404f;
  --text:#e9ecf3; --text-2:#b6bdcd; --text-3:#8f97a9;
  --brand:#8b8cf7; --brand-soft:#232445; --brand-text:#c3c4fb;
  --fund-lop:#8b8cf7;  --fund-lop-soft:#22244a;  --fund-lop-text:#c3c4fb;
  --fund-doan:#e8a35c; --fund-doan-soft:#3a2a15; --fund-doan-text:#f6cd9b;
  --income:#4ec98c; --income-soft:#123227;
  --expense:#f2748a; --expense-soft:#3a1a22;
  --warn:#e9b26a; --warn-soft:#38290f;
  --focus:#7aa5ff;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 18px 44px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0e1016; --surface:#171a22; --surface-2:#1d212b; --surface-3:#252a36;
  --border:#272c38; --border-strong:#39404f;
  --text:#e9ecf3; --text-2:#b6bdcd; --text-3:#8f97a9;
  --brand:#8b8cf7; --brand-soft:#232445; --brand-text:#c3c4fb;
  --fund-lop:#8b8cf7;  --fund-lop-soft:#22244a;  --fund-lop-text:#c3c4fb;
  --fund-doan:#e8a35c; --fund-doan-soft:#3a2a15; --fund-doan-text:#f6cd9b;
  --income:#4ec98c; --income-soft:#123227;
  --expense:#f2748a; --expense-soft:#3a1a22;
  --warn:#e9b26a; --warn-soft:#38290f;
  --focus:#7aa5ff;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 18px 44px -12px rgba(0,0,0,.7);
}

/* ============================== BASE ============================== */
*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(16px * var(--fs-scale));-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:1rem; line-height:1.6;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
body.reading{ --fs-scale:1.12; line-height:1.8; letter-spacing:.01em; word-spacing:.05em }
body.reading .btn,body.reading th{text-transform:none!important}
h1,h2,h3,h4{font-family:var(--font-head); line-height:1.25; letter-spacing:-.01em; margin:0}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.25rem;font-weight:600} h3{font-size:1.0625rem;font-weight:600}
p{margin:0 0 .5rem} a{color:var(--brand)}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.small{font-size:.8125rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-48px;z-index:200;background:var(--surface);border:1px solid var(--border);
  padding:.5rem .8rem;border-radius:var(--radius-sm);transition:top var(--dur) var(--ease-out)}
.skip:focus{top:8px}

/* ============================== LAYOUT ============================== */
.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.side{
  background:var(--surface); border-right:1px solid var(--border);
  padding:1.1rem .8rem; display:flex; flex-direction:column; gap:.35rem;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:.6rem;padding:.2rem .5rem 1rem}
.brand-logo{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--fund-lop),var(--fund-doan));
  display:grid;place-items:center;color:#fff;font-family:var(--font-head);font-weight:700;font-size:1.05rem;
  box-shadow:var(--shadow-1)
}
.brand-name{font-family:var(--font-head);font-weight:700;font-size:1.0625rem;line-height:1.15}
.brand-sub{font-size:.75rem;color:var(--text-3);line-height:1.2}
.nav-item{
  display:flex;align-items:center;gap:.65rem;width:100%;
  padding:.62rem .7rem;border:0;background:transparent;color:var(--text-2);
  font:inherit;font-weight:500;text-align:left;border-radius:var(--radius-sm);cursor:pointer;
  position:relative; transition:background var(--dur-fast) var(--ease-io), color var(--dur-fast) var(--ease-io), transform var(--dur-fast) var(--ease-out);
  min-height:44px
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item:active{transform:scale(.985)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.nav-item.active::before{
  content:"";position:absolute;left:-.8rem;top:50%;translate:0 -50%;
  width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--brand);
  animation:navIn var(--dur) var(--ease-out)
}
@keyframes navIn{from{height:4px;opacity:0}to{height:22px;opacity:1}}
.nav-item .ico{width:20px;height:20px;flex:0 0 auto;stroke-width:1.9}
.nav-sep{height:1px;background:var(--border);margin:.55rem .3rem}
.side-foot{margin-top:auto;padding-top:.7rem;display:flex;flex-direction:column;gap:.3rem}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  padding:.85rem 1.35rem; border-bottom:1px solid var(--border);
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:blur(10px); position:sticky; top:0; z-index:30
}
.topbar h1{font-size:1.3rem}
.topbar .grow{flex:1 1 auto}
.content{padding:1.35rem;width:100%}
.page{animation:pageIn var(--dur-page) var(--ease-out)}
@keyframes pageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:262px;z-index:80;transform:translateX(-104%);
    transition:transform var(--dur-slow) var(--ease-out);box-shadow:var(--shadow-2)}
  .side.open{transform:none}
  .content{padding:1rem .85rem}
  .scrim{position:fixed;inset:0;background:rgba(9,11,16,.5);z-index:70;animation:fade var(--dur) var(--ease-out)}
}
@media (min-width:901px){ .burger{display:none} .scrim{display:none} }

/* ============================== ATOMS ============================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:40px;padding:.5rem .9rem;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:transform var(--dur-fast) var(--ease-out), background var(--dur-fast), border-color var(--dur-fast), box-shadow var(--dur-fast)
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:transparent;color:#fff;box-shadow:var(--shadow-1)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.income{background:var(--income);border-color:transparent;color:#fff}
.btn.expense{background:var(--expense);border-color:transparent;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--expense);border-color:color-mix(in srgb,var(--expense) 35%, var(--border))}
.btn.danger:hover{background:var(--expense-soft)}
.btn.sm{min-height:32px;padding:.28rem .58rem;font-size:.8125rem;border-radius:var(--radius-xs)}
.btn.icon{width:40px;padding:0} .btn.icon.sm{width:32px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none!important}
.btn .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.16rem .5rem;border-radius:999px;
  font-size:.75rem;font-weight:600;line-height:1.5;border:1px solid transparent;white-space:nowrap}
.badge.lop{background:var(--fund-lop-soft);color:var(--fund-lop-text);border-color:color-mix(in srgb,var(--fund-lop) 26%,transparent)}
.badge.doan{background:var(--fund-doan-soft);color:var(--fund-doan-text);border-color:color-mix(in srgb,var(--fund-doan) 26%,transparent)}
.badge.ok{background:var(--income-soft);color:var(--income)}
.badge.no{background:var(--surface-3);color:var(--text-2)}
.badge.part{background:var(--warn-soft);color:var(--warn)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-1)}
.card-h{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.9rem 1.05rem;border-bottom:1px solid var(--border)}
.card-h h2,.card-h h3{flex:1 1 auto;min-width:120px}
.card-b{padding:1.05rem}
.card-b.tight{padding:.35rem .35rem}
.grid{display:grid;gap:1rem}
.row{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}

/* ============================== STAT CARDS ============================== */
.funds{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:1rem}
.fundcard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-1);padding:1.05rem}
.fundcard::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent,var(--brand))}
.fundcard.lop{--accent:var(--fund-lop)} .fundcard.doan{--accent:var(--fund-doan)} .fundcard.all{--accent:var(--text-3)}
.fundcard h3{display:flex;align-items:center;gap:.45rem;font-size:.95rem;color:var(--text-2)}
.fundcard .bal{font-family:var(--font-head);font-weight:700;font-size:2.05rem;line-height:1.1;margin:.5rem 0 .1rem;
  letter-spacing:-.02em;color:var(--text)}
.fundcard .bal.neg{color:var(--expense)}
.fundcard .bal-lbl{font-size:.78rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.fundcard .split{display:flex;gap:1.1rem;margin-top:.85rem;padding-top:.75rem;border-top:1px dashed var(--border)}
.fundcard .split div{flex:1}
.fundcard .split .k{font-size:.78rem;color:var(--text-3);display:flex;align-items:center;gap:.25rem}
.fundcard .split .v{font-weight:600;font-size:1.02rem}
.v.in{color:var(--income)} .v.out{color:var(--expense)}
.lifetime{margin-top:.7rem;font-size:.8125rem;color:var(--text-3)}
.lifetime b{color:var(--text-2)}

/* ============================== PROGRESS ============================== */
.prog{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.prog>span{display:block;height:100%;border-radius:99px;background:var(--accent,var(--brand));
  transform-origin:left center;transform:scaleX(0);
  transition:transform var(--dur-slow) var(--ease-out)}
.prog.full>span{position:relative;overflow:hidden}
.prog.full>span::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  transform:translateX(-100%);animation:sheen 1.1s var(--ease-out) .25s}
@keyframes sheen{to{transform:translateX(100%)}}
.periodrow{padding:.8rem 1.05rem;border-bottom:1px solid var(--border)}
.periodrow:last-child{border-bottom:0}
.periodrow .top{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.45rem}
.periodrow .top .nm{font-weight:600}
.periodrow .top .amt{margin-left:auto;font-size:.875rem;color:var(--text-2)}

/* ============================== TABLE ============================== */
/* overflow-y phải khai rõ là hidden: theo CSS, một trục `auto` sẽ biến trục `visible` còn
   lại thành `auto`, nên khung thành vùng cuộn cả hai chiều và cú kéo dọc trên điện thoại bị
   mắc kẹt ở đây — không cuộn được gì mà cũng không nhường lại cho trang.
   contain:inline-size để bảng rộng không làm phình thẻ chứa và tràn cả trang. */
.tablewrap{
  min-width:0;contain:inline-size;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain
}
/* Bảng rộng hơn khung thì CUỘN, không bị bóp: mỗi cột đúng bề rộng nội dung. */
table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem}
caption{text-align:left;padding:.4rem .7rem;color:var(--text-3);font-size:.8125rem}
/* KHÔNG sticky: vùng cuộn gần nhất là .tablewrap (cuộn ngang), nên sticky không giữ được
   tiêu đề khi cuộn trang mà chỉ gây giật/kẹt khi cuộn ngang trên Safari iOS. */
th{
  background:var(--surface-2);color:var(--text-2);
  font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.045em;
  text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--border);white-space:nowrap
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text);background:var(--surface-3)}
th .arr{opacity:.35;font-size:.7rem;margin-left:.15rem}
th.sorted .arr{opacity:1;color:var(--brand)}
td{max-width:20rem;padding:.55rem .7rem;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background var(--dur-fast)}
tbody tr:hover{background:var(--surface-2)}
tbody tr.stag{animation:rowIn var(--dur) var(--ease-out) backwards;animation-delay:calc(var(--i,0) * 24ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
tr.flash{animation:flash 1.8s var(--ease-out)}
@keyframes flash{0%{background:var(--brand-soft)}100%{background:transparent}}
tr.pending{opacity:.55}
td.r,th.r{text-align:right}
td.money{text-align:right;font-weight:500;white-space:nowrap}
td.money.in{color:var(--income)} td.money.out{color:var(--expense)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--border-strong);border-bottom:0}
.tblfoot{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;padding:.7rem 1.05rem;border-top:1px solid var(--border);
  background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius);font-size:.875rem}
.cellbtn{border:0;background:transparent;font:inherit;cursor:pointer;padding:.1rem;border-radius:var(--radius-xs);
  transition:transform var(--dur-fast) var(--ease-out)}
.cellbtn:hover{transform:scale(1.05)}
.rowacts{display:flex;gap:.2rem;justify-content:flex-end;opacity:.35;transition:opacity var(--dur-fast)}
tr:hover .rowacts,tr:focus-within .rowacts{opacity:1}

/* ============================== FORM ============================== */
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.85rem;min-width:0}
.field>label{font-size:.8125rem;font-weight:600;color:var(--text-2)}
.field .hint{font-size:.75rem;color:var(--text-3)}
.field .err{font-size:.8125rem;color:var(--expense);font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=email],select,textarea{
  width:100%;min-height:42px;padding:.5rem .7rem;font:inherit;color:var(--text);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  transition:border-color var(--dur-fast), box-shadow var(--dur-fast), background var(--dur-fast)
}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}

  min-height:48px;padding:.5rem .7rem;border:2px solid var(--border);border-radius:var(--radius-sm);

/* ============================== MODAL ============================== */
.modal-back{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:1rem;
  background:rgba(10,12,18,.42);backdrop-filter:blur(0px);animation:backIn var(--dur) var(--ease-out) forwards}

.modal{width:100%;max-width:var(--mw,560px);max-height:92vh;overflow:auto;background:var(--surface);
  border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-2);
  animation:modalIn var(--dur-slow) var(--ease-out)}

/* ============================== TOAST ============================== */

  max-width:min(400px,calc(100vw - 2rem))}

  animation:toastIn var(--dur-slow) var(--ease-out);position:relative;overflow:hidden}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut var(--dur-fast) var(--ease-in) forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(18px)}}
.toast .msg{flex:1;font-size:.9rem}

.toast::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--brand);

@keyframes tprog{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.toast.ok{border-left:3px solid var(--income)} .toast.ok::after{background:var(--income)}

<script>
'use strict';
/* ==========================================================================
   STATE — hằng số + state gốc
   ========================================================================== */
const FUNDS = {
  QUY_LOP:  { label:'Quỹ Lớp',  short:'Lớp',  cls:'lop'  },
  QUY_DOAN: { label:'Quỹ Đoàn', short:'Đoàn', cls:'doan' },
};
const FUND_KEYS = Object.keys(FUNDS);              // thêm quỹ mới ⇒ chỉ sửa FUNDS + 2 biến màu CSS
const METHODS   = { CASH:'Tiền mặt', TRANSFER:'Chuyển khoản' };
const CATEGORIES= ['Sinh hoạt','Sự kiện','Văn phòng phẩm','Quà tặng','In ấn','Khác'];
const LS_KEY    = 'classFund.v1';
const PREF_KEY  = 'classFund.prefs';

let S = emptyState();                               // dữ liệu nghiệp vụ
let P = { theme:'auto', reading:false, noMotion:false, fontScale:1 };  // tuỳ chọn hiển thị
let ui = {
  view:'dashboard',
  range:{ mode:'all', from:'', to:'' },
  q:'', studentFilter:{ fund:'', periodId:'', status:'' },
  incFilter:{ fund:'', periodId:'', studentId:'', from:'', to:'' },
  expFilter:{ fund:'', category:'', buyer:'', from:'', to:'' },
  sort:{ students:{k:'stt',d:1}, incomes:{k:'date',d:-1}, expenses:{k:'date',d:-1} },
  lastDeleted:null, lastImport:null, flashIds:[],
};

function emptyState(){
  return {
    meta:{ className:'', faculty:'', term:'', schoolYear:'', version:1, updatedAt:new Date().toISOString(), demo:false,
           // Tài khoản nhận chuyển khoản — dùng để sinh QR VietQR cho từng sinh viên
           bank:{ bin:'', bankName:'', accountNo:'', accountName:'', template:'{ma} {dot}' } },
    students:[], periods:[], incomes:[], expenses:[],
  };
}

/* ==========================================================================
   STORAGE — localStorage + sao lưu/phục hồi JSON
   ========================================================================== */
function save(){
  S.meta.updatedAt = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ toast('err','Không lưu được dữ liệu', 'localStorage đầy hoặc bị chặn. Hãy sao lưu JSON ngay.'); }
}
function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    S = migrate(d);
    return true;
  } catch(e){ console.error(e); return false; }
}
function migrate(d){
  const base = emptyState();
  const out = Object.assign(base, d||{});
  out.meta = Object.assign(base.meta, d && d.meta || {});
  out.meta.bank = Object.assign({ bin:'', bankName:'', accountNo:'', accountName:'', template:'{ma} {dot}' },
                                (d && d.meta && d.meta.bank) || {});
  ['students','periods','incomes','expenses'].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
  // chuẩn hoá: mã SV luôn là string, tiền luôn là số nguyên
  out.students.forEach(s=>{ s.code = String(s.code==null?'':s.code); s.fullName = s.fullName || fullNameOf(s); });
  out.periods.forEach(p=>{ p.amountPerStudent = int(p.amountPerStudent); });
  out.incomes.forEach(i=>{ i.amount = int(i.amount); });
  out.expenses.forEach(e=>{ e.amount = int(e.amount); });
  return out;
}
function savePrefs(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(P)); }catch(e){} }
function loadPrefs(){
  try{ const r = localStorage.getItem(PREF_KEY); if(r) P = Object.assign(P, JSON.parse(r)); }catch(e){}
}
function backupJSON(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  downloadBlob(blob, `Backup_ClassFund_${S.meta.className||'lop'}_${stampNow()}.json`);
  toast('ok','Đã tải file sao lưu','Giữ file này để phục hồi khi đổi máy.');
}
function restoreJSON(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d || !Array.isArray(d.students)) throw new Error('Cấu trúc file không đúng');
      S = migrate(d); save(); render();
      toast('ok','Đã phục hồi dữ liệu', `${S.students.length} sinh viên · ${S.incomes.length} khoản thu · ${S.expenses.length} khoản chi`);
    } catch(e){ toast('err','Không đọc được file sao lưu', e.message); }
  };
  fr.readAsText(file);
}

/* ==========================================================================
   UTILS — tiền, ngày, bỏ dấu tiếng Việt, quy đổi serial Excel
   ========================================================================== */
const byId = id => document.getElementById(id);
const int  = v => { const n = Math.round(Number(v)); return Number.isFinite(n) ? n : 0; };
function uid(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9);
}
const nf = new Intl.NumberFormat('vi-VN');
const fmtNum  = n => nf.format(int(n));
const fmtVND  = n => nf.format(int(n)) + ' ₫';
const fmtVNDs = n => (int(n) < 0 ? '−' : '') + nf.format(Math.abs(int(n))) + ' ₫';
/** Nhận '50000', '50.000', '50,000 ₫', '  50 000 ' → 50000. Trả 0 nếu không có chữ số. */
function parseMoney(v){
  if (typeof v === 'number') return int(v);
  const digits = String(v==null?'':v).replace(/[^\d]/g,'');
  return digits ? parseInt(digits,10) : 0;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const todayISO = () => new Date().toISOString().slice(0,10);
function fmtDate(iso){
  if (!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso);

function monthKey(iso){ return (iso||'').slice(0,7); }
function stampNow(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
/** Bỏ dấu tiếng Việt + hạ chữ thường, để tìm kiếm "tran van mau" khớp "Trần Văn Mẫu". */
function noAccent(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ').trim();
}
/** Mã SV: Excel hay lưu dạng số ⇒ '2.400000001E9' / 2400000001.0 → '2400000001'. Giữ số 0 đầu nếu là chuỗi. */
function normCode(v){
  if (v == null || v === '') return '';
  if (typeof v === 'number') return Number.isFinite(v) ? String(Math.round(v)) : '';
  let s = String(v).trim().replace(/\s+/g,'');
  if (/^\d+$/.test(s)) return s;                                  // chuỗi số thuần → giữ nguyên (kể cả 0 đầu)
  if (/^[\d.,]+[eE][+-]?\d+$/.test(s) || /^\d+\.0+$/.test(s)){    // ký hiệu khoa học hoặc .0
    const n = Number(s.replace(/,/g,''));
    if (Number.isFinite(n)) return String(Math.round(n));
  }
  return s;
}
/**
 * Serial date của Excel (hệ 1900) → 'YYYY-MM-DD'.
 * Mốc gốc là 1899-12-30 (không phải 1900-01-01) vì Excel coi 1900 là năm nhuận —
 * lấy mốc này là đã xử lý luôn bug đó cho mọi serial > 60.
 * Kiểm chứng: 38918 → 2006-07-20 · 38873 → 2006-06-05 · 38399 → 2005-02-16 · 39077 → 2006-12-26
 */
function excelSerialToISO(serial){
  const n = Number(serial);
  if (!Number.isFinite(n) || n <= 0 || n > 60000) return '';
  const ms = Date.UTC(1899,11,30) + Math.round(n) * 86400000;
  return new Date(ms).toISOString().slice(0,10);
}
/** Nhận Date | serial Excel | 'dd/MM/yyyy' | 'd/M/yy' | 'yyyy-MM-dd' → 'YYYY-MM-DD' hoặc ''. */
function parseDateFlexible(v){
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) {
    // SheetJS có thể trả về Date lệch vài giây so với nửa đêm (VD 2006-07-19T16:59:56Z ở TZ+7
    // đại diện cho ngày 20/07/2006). Lấy ngày theo giờ địa phương thẳng sẽ bị lùi 1 ngày,
    // nên phải làm tròn về mốc nửa đêm gần nhất trước khi cắt lấy ngày.
    const localMs = v.getTime() - v.getTimezoneOffset() * 60000;
    return new Date(Math.round(localMs / 86400000) * 86400000).toISOString().slice(0,10);
  }
  if (typeof v === 'number') return excelSerialToISO(v);
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  if (/^\d{3,5}(\.\d+)?$/.test(s)) return excelSerialToISO(Number(s));   // serial dạng chuỗi
  const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);
  if (m){
    let [,d,mo,y] = m; y = Number(y);
    if (y < 100) y += (y > 40 ? 1900 : 2000);
    const p = n => String(n).padStart(2,'0');
    return `${y}-${p(Number(mo))}-${p(Number(d))}`;
  }
  return '';
}

/* ==========================================================================
   QR — VietQR (Napas 247) để sinh mã chuyển khoản cho từng sinh viên
   Payload theo chuẩn EMVCo: TLV (tag + độ dài 2 chữ số + giá trị), kết thúc bằng CRC16.
   App tự dựng payload và tự vẽ QR trên máy — số tài khoản KHÔNG bị gửi ra dịch vụ nào.
   ========================================================================== */
const BANKS = [
  { bin:'970436', name:'Vietcombank' }, { bin:'970415', name:'VietinBank' },
  { bin:'970418', name:'BIDV' },        { bin:'970405', name:'Agribank' },
  { bin:'970407', name:'Techcombank' }, { bin:'970422', name:'MB Bank' },
  { bin:'970416', name:'ACB' },         { bin:'970432', name:'VPBank' },
  { bin:'970423', name:'TPBank' },      { bin:'970403', name:'Sacombank' },
  { bin:'970441', name:'VIB' },         { bin:'970443', name:'SHB' },
  { bin:'970437', name:'HDBank' },      { bin:'970448', name:'OCB' },
  { bin:'970426', name:'MSB' },         { bin:'970440', name:'SeABank' },
  { bin:'970449', name:'LPBank' },      { bin:'970431', name:'Eximbank' },
  { bin:'970454', name:'BVBank' },      { bin:'970425', name:'ABBank' },
  { bin:'970412', name:'PVcomBank' },   { bin:'970409', name:'BacA Bank' },
  { bin:'970428', name:'Nam A Bank' },  { bin:'970433', name:'VietBank' },
  { bin:'970452', name:'KienlongBank' },{ bin:'970400', name:'SaigonBank' },
];
/** CRC16/CCITT-FALSE — chuẩn CRC của EMVCo. Kiểm chứng: crc16('123456789') === '29B1'. */
function crc16(str){
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++){
    crc ^= (str.charCodeAt(i) & 0xFF) << 8;
    for (let j = 0; j < 8; j++)
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, val) => id + String(String(val).length).padStart(2, '0') + val;
/** Nội dung chuyển khoản: chỉ chữ/số/khoảng trắng, không dấu, in hoa, tối đa 25 ký tự. */
function cleanTransferNote(str){
  return noAccent(str).toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 25).trim();
}
/**
 * Dựng payload VietQR chuyển khoản tới tài khoản.
 *   00 phiên bản · 01 kiểu (11 tĩnh / 12 có sẵn số tiền) · 38 thông tin thụ hưởng
 *   53 tiền tệ (704 = VND) · 54 số tiền · 58 quốc gia · 62.08 nội dung · 63 CRC
 */
function buildVietQR(o){
  const bin = String(o.bin || '').trim(), acc = String(o.accountNo || '').trim();
  if (!/^\d{6}$/.test(bin) || !acc) return '';
  const amount = int(o.amount);
  const merchant = tlv('00', 'A000000727')
    + tlv('01', tlv('00', bin) + tlv('01', acc))
    + tlv('02', 'QRIBFTTA');
  let p = tlv('00', '01') + tlv('01', amount > 0 ? '12' : '11') + tlv('38', merchant) + tlv('53', '704');
  if (amount > 0) p += tlv('54', String(amount));
  p += tlv('58', 'VN');
  const note = cleanTransferNote(o.description || '');
  if (note) p += tlv('62', tlv('08', note));
  p += '6304';
  return p + crc16(p);
}
/** Nội dung chuyển khoản theo mẫu trong Cài đặt: {ma} {ten} {dot} {quy} {lop} */
function transferNote(student, period){
  const tpl = (S.meta.bank && S.meta.bank.template) || '{ma} {dot}';
  return cleanTransferNote(tpl
    .replace(/\{ma\}/g,   student ? student.code : '')
    .replace(/\{ten\}/g,  student ? student.fullName : '')
    .replace(/\{dot\}/g,  period ? period.name : '')
    .replace(/\{quy\}/g,  period ? FUNDS[period.fund].label : '')
    .replace(/\{lop\}/g,  S.meta.className || ''));
}
const bankConfigured = () => {
  const b = S.meta.bank || {};
  return /^\d{6}$/.test(String(b.bin||'')) && !!String(b.accountNo||'').trim();
};
/** Vẽ QR vào một phần tử. Trả về false nếu thư viện QR chưa tải được. */
function renderQR(el, payload, cellSize){
  if (typeof qrcode === 'undefined' || !payload) return false;
  try {
    const qr = qrcode(0, 'M');            // tự chọn phiên bản, mức sửa lỗi M
    qr.addData(payload);
    qr.make();
    el.innerHTML = qr.createSvgTag({ cellSize: cellSize || 4, margin: 2, scalable: true });
    const svg = el.querySelector('svg');
    if (svg){ svg.style.width = '100%'; svg.style.height = 'auto'; svg.setAttribute('role','img');
      svg.setAttribute('aria-label','Mã QR chuyển khoản'); }
    return true;
  } catch(e){ console.error(e); return false; }
}

/* ==========================================================================
   COMPUTE — nguồn sự thật duy nhất cho mọi con số
   Tồn quỹ(X) = Σ Thu(X) − Σ Chi(X). Không cache, tính lại mỗi lần render.
   ========================================================================== */
function inRange(iso, r){
  if (!r || r.mode === 'all') return true;
  if (r.mode === 'month')  return monthKey(iso) === monthKey(todayISO());
  if (r.mode === 'day')    return !!r.from && iso === r.from;
  if (r.mode === 'range')  return (!r.from || iso >= r.from) && (!r.to || iso <= r.to);
  return true;
}
function totalsByFund(range){
  const out = {};
  FUND_KEYS.forEach(f => out[f] = { income:0, expense:0, balance:0 });
  S.incomes .forEach(i => { if (out[i.fund] && inRange(i.date, range)) out[i.fund].income  += int(i.amount); });
  S.expenses.forEach(e => { if (out[e.fund] && inRange(e.date, range)) out[e.fund].expense += int(e.amount); });
  FUND_KEYS.forEach(f => out[f].balance = out[f].income - out[f].expense);
  return out;
}
/** Tồn quỹ luỹ kế toàn thời gian của 1 quỹ — dùng cho cảnh báo vượt quỹ. */
function lifetimeBalance(fund){
  let b = 0;
  S.incomes .forEach(i => { if (i.fund === fund) b += int(i.amount); });
  S.expenses.forEach(e => { if (e.fund === fund) b -= int(e.amount); });
  return b;
}
function sumTotals(t, key){ return FUND_KEYS.reduce((a,f)=>a + t[f][key], 0); }
const studentById = id => S.students.find(s=>s.id===id) || null;
const periodById  = id => S.periods.find(p=>p.id===id)  || null;
function paidOf(studentId, periodId){
  let sum = 0;
  S.incomes.forEach(i => { if (i.studentId===studentId && i.periodId===periodId) sum += int(i.amount); });
  return sum;
}
/** Bảng công nợ: mỗi SV × mỗi đợt. status: paid | partial | none */
function debtMatrix(){
  const periods = S.periods.filter(p=>true);
  return S.students.filter(s=>s.active!==false).map(s=>{
    const cells = periods.map(p=>{
      const paid = paidOf(s.id, p.id), must = int(p.amountPerStudent);
      const remaining = Math.max(must - paid, 0);
      return { period:p, paid, must, remaining,
               status: paid >= must && must > 0 ? 'paid' : (paid > 0 ? 'partial' : 'none') };
    });
    const totalPaid = cells.reduce((a,c)=>a+c.paid,0);
    const totalMust = cells.reduce((a,c)=>a+c.must,0);
    return { student:s, cells, totalPaid, totalMust, totalRemaining: Math.max(totalMust-totalPaid,0) };
  });
}
function periodStats(p){
  const actives = S.students.filter(s=>s.active!==false);
  let collected = 0, paidCount = 0, partialCount = 0;
  actives.forEach(s=>{
    const paid = paidOf(s.id, p.id);
    collected += paid;
    if (paid >= int(p.amountPerStudent) && int(p.amountPerStudent) > 0) paidCount++;
    else if (paid > 0) partialCount++;
  });
  const expected = actives.length * int(p.amountPerStudent);
  return { expected, collected, paidCount, partialCount,
           unpaidCount: actives.length - paidCount - partialCount,
           remaining: Math.max(expected - collected, 0),
           pct: expected ? Math.min(collected/expected, 1) : 0, total: actives.length };
}
/** Nhật ký gộp thu+chi theo thời gian, kèm số dư luỹ kế của từng quỹ. */
function dailyLedger(range){
  const rows = [];
  S.incomes .forEach(i => rows.push({ kind:'THU', date:i.date, fund:i.fund, amount:int(i.amount), ref:i,
      label: i.studentId ? (studentById(i.studentId)?.fullName || '(SV đã xoá)') : (i.payerName||'Nguồn khác'),
      extra: i.periodId ? (periodById(i.periodId)?.name || '') : 'Ngoài đợt' }));
  S.expenses.forEach(e => rows.push({ kind:'CHI', date:e.date, fund:e.fund, amount:int(e.amount), ref:e,
      label: e.item, extra: e.buyer }));
  rows.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : (a.kind===b.kind?0:(a.kind==='THU'?-1:1)));
  const run = {}; FUND_KEYS.forEach(f=>run[f]=0);
  rows.forEach(r => { run[r.fund] += (r.kind==='THU' ? r.amount : -r.amount); r.running = run[r.fund]; });
  return range ? rows.filter(r=>inRange(r.date, range)) : rows;
}
function monthlySeries(){
  const map = new Map();
  const touch = k => { if(!map.has(k)) map.set(k,{key:k,income:0,expense:0}); return map.get(k); };
  S.incomes .forEach(i => touch(monthKey(i.date)).income  += int(i.amount));
  S.expenses.forEach(e => touch(monthKey(e.date)).expense += int(e.amount));
  return [...map.values()].filter(x=>x.key).sort((a,b)=>a.key<b.key?-1:1).slice(-8);
}

    <button class="btn icon sm ghost" aria-label="Đóng thông báo">✕</button>`;

function openModal(o){
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `
    <div class="modal${o.wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="mdT">
      <div class="modal-h">
        <div class="t"><h2 id="mdT">${o.title}</h2>${o.sub?`<div class="sub">${o.sub}</div>`:''}</div>
        <button class="btn icon ghost" data-close aria-label="Đóng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-b">${o.body||''}</div>
      ${o.footer ? `<div class="modal-f">${o.footer}</div>` : ''}
    </div>`;
  const prevFocus = document.activeElement;
  const close = () => {
    back.classList.add('closing');
    setTimeout(()=>{ back.remove(); if (prevFocus && prevFocus.focus) prevFocus.focus(); }, 170);
    document.removeEventListener('keydown', onKey);
  };
  function onKey(e){
    if (e.key === 'Escape'){ e.stopPropagation(); close(); return; }
    if (e.key === 'Tab'){                             // focus trap
      const f = [...back.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])')]
        .filter(x=>x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length-1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  }
  back.addEventListener('click', e => { if (e.target === back) close(); });
  back.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  document.addEventListener('keydown', onKey);
  byId('modalRoot').appendChild(back);
  const api = { root:back, close, el: sel => back.querySelector(sel), all: sel => [...back.querySelectorAll(sel)] };
  if (o.onMount) o.onMount(api);
  setTimeout(()=>{
    const target = back.querySelector('[data-autofocus]') || back.querySelector('input,select,textarea,button');
    if (target) target.focus();
  }, 60);
  return api;
}
/** Xác nhận 2 bước cho hành động xoá / nguy hiểm. */
function confirmDialog({ title, message, okLabel, danger, onOk }){
  openModal({

    body: `<p style="margin:.2rem 0 .6rem">${message}</p>`,
    footer: `<button class="btn" data-close>Huỷ</button>
             <button class="btn ${danger?'expense':'primary'}" data-ok data-autofocus>${esc(okLabel||'Xác nhận')}</button>`,
    onMount(m){ m.el('[data-ok]').onclick = () => { m.close(); onOk(); }; }
  });
}
const reduceMotion = () => P.noMotion ||
  (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches);
/** Số liệu chạy từ 0 → giá trị thật (700ms, easeOutExpo). Tôn trọng "giảm chuyển động". */
function countUp(el, to, suffix){
  const end = int(to), sfx = suffix===undefined ? ' ₫' : suffix;
  if (reduceMotion()){ el.textContent = fmtNum(end) + sfx; return; }
  const dur = 700, t0 = performance.now(), from = 0;
  (function step(now){
    const p = Math.min((now - t0)/dur, 1);
    const eased = p === 1 ? 1 : 1 - Math.pow(2, -10*p);
    el.textContent = fmtNum(from + (end-from)*eased) + sfx;
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function stagger(rows){ [...rows].forEach((tr,i) => { tr.classList.add('stag'); tr.style.setProperty('--i', Math.min(i,12)); }); }
function flashRow(id){
  const tr = document.querySelector(`tr[data-id="${id}"]`);
  if (!tr) return;
  tr.classList.add('flash');
  if (!reduceMotion() && typeof tr.scrollIntoView === 'function') tr.scrollIntoView({ behavior:'smooth', block:'center' });
  setTimeout(()=>tr.classList.remove('flash'), 1900);
}

}

function wireCommon(){
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => {

  if (f) f.onchange = () => { ui.range.from = f.value; render(); };
  if (t) t.onchange = () => { ui.range.to   = t.value; render(); };
}

/* ============================== TRANG: DANH SÁCH LỚP ============================== */
function sortRows(rows, cfg, getters){
  const g = getters[cfg.k];
  if (!g) return rows;
  return [...rows].sort((a,b)=>{
    const x = g(a), y = g(b);
    if (typeof x === 'number' && typeof y === 'number') return (x-y)*cfg.d;
    return String(x).localeCompare(String(y),'vi') * cfg.d;
  });
}
function th(view, key, label, extraCls){
  const c = ui.sort[view];
  const on = c.k === key;
  return `<th class="sortable ${on?'sorted':''} ${extraCls||''}" data-sort="${key}" tabindex="0" role="button"
    aria-label="Sắp xếp theo ${esc(label)}">${esc(label)}<span class="arr">${on ? (c.d>0?'▲':'▼') : '↕'}</span></th>`;
}
function wireSort(view){
  document.querySelectorAll('th[data-sort]').forEach(el => {
    const act = () => {
      const k = el.dataset.sort, c = ui.sort[view];
      if (c.k === k) c.d = -c.d; else { c.k = k; c.d = 1; }
      render();
    };
    el.onclick = act;
    el.onkeydown = e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } };
  });
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }

function openPeriodDetail(id){
  const p = periodById(id); if (!p) return;
  const st = periodStats(p);
  const rows = S.students.filter(s=>s.active!==false).map(s=>{
    const paid = paidOf(s.id, p.id), must = int(p.amountPerStudent);
    return { s, paid, must, remaining: Math.max(must-paid,0),
             status: paid>=must&&must>0 ? 'paid' : paid>0 ? 'partial' : 'none' };
  });
  const group = (k, label, cls) => {
    const g = rows.filter(r=>r.status===k);
    if (!g.length) return '';
    return `<h3 style="margin-top:.9rem">${label} <span class="badge ${cls}">${g.length}</span></h3>
      <div class="tablewrap"><table><tbody>${g.map(r=>`<tr>
        <td class="num small muted">${esc(r.s.code)}</td><td>${esc(r.s.fullName)}</td>
        <td class="money in">${r.paid?fmtVND(r.paid):'—'}</td>
        <td class="money out">${r.remaining?fmtVND(r.remaining):''}</td>
        <td class="r"><button class="btn sm primary" data-qr2="${r.s.id}">QR</button>
          <button class="btn sm" data-pay2="${r.s.id}">Thu tay</button></td></tr>`).join('')}</tbody></table></div>`;
  };
  openModal({
    title: esc(p.name), wide:true,
    sub: `${FUNDS[p.fund].label} · ${fmtVND(p.amountPerStudent)}/SV · thu được ${fmtVND(st.collected)} / dự kiến ${fmtVND(st.expected)}`,
    body: `<div class="prog ${st.pct>=1?'full':''}" style="--accent:var(--fund-${FUNDS[p.fund].cls})">
             <span style="transform:scaleX(${st.pct})"></span></div>
           ${group('none','Chưa đóng','no')}${group('partial','Đóng thiếu','part')}${group('paid','Đã đóng đủ','ok')}`,
    footer: `<button class="btn" data-close>Đóng</button>`,
    onMount(m){
      m.all('[data-pay2]').forEach(x => x.onclick = () => {
        m.close(); openIncomeModal({ studentId:x.dataset.pay2, periodId:p.id });
      });
      m.all('[data-qr2]').forEach(x => x.onclick = () => {
        m.close(); openQRModal({ studentId:x.dataset.qr2, periodId:p.id });
      });
    }
  });
}

function postIO(){
  const drop = byId('drop'), fi = byId('fileInput');
  if (drop){
    drop.onclick = () => fi.click();
    drop.onkeydown = e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); fi.click(); } };
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) openImportModal(f); });
    fi.onchange = () => { if (fi.files[0]) openImportModal(fi.files[0]); fi.value = ''; };
  }
  const b = (id, fn) => { const el = byId(id); if (el) el.onclick = fn; };
  b('btnTemplate', downloadTemplate);
  b('btnUndoImport', undoImport);
  b('exAll',   () => openExportModal('all'));
  b('exRange', () => openExportModal('range'));
  b('exDay',   () => openExportModal('day'));
  b('btnPrint', () => window.print());
  b('btnBackup', backupJSON);
  b('btnRestore', () => byId('restoreInput').click());
  const ri = byId('restoreInput');
  if (ri) ri.onchange = () => { if (ri.files[0]) restoreJSON(ri.files[0]); ri.value = ''; };
}

function postSettings(){
  const b = (id, fn) => { const el = byId(id); if (el) el.onclick = fn; };
  b('mSave', () => {
    S.meta.className  = byId('mClass').value.trim();
    S.meta.faculty    = byId('mFaculty').value.trim();
    S.meta.term       = byId('mTerm').value.trim();
    S.meta.schoolYear = byId('mYear').value.trim();
    save(); render(); toast('ok','Đã lưu thông tin lớp');
  });
  // CHÚ Ý: phải giới hạn trong #main. `[data-theme]` cũng khớp thẻ <html data-theme="...">,
  // gán onclick lên <html> sẽ khiến mọi click trong app bubble lên và render lại cả trang.
  // --- tài khoản nhận chuyển khoản ---
  const bkBank = byId('bkBank'), bkBin = byId('bkBin'), bkTpl = byId('bkTpl');
  const previewNote = () => {
    const el = byId('bkPreview'); if (!el) return;
    const stu = S.students.find(x=>x.active!==false) || { code:'2400000001', fullName:'Trần Văn Mẫu' };
    const per = S.periods[0] || { name:'Quỹ lớp đợt 1', fund:FUND_KEYS[0] };
    const saved = S.meta.bank.template;
    S.meta.bank.template = bkTpl ? bkTpl.value : saved;
    el.textContent = transferNote(stu, per) || '(trống)';
    S.meta.bank.template = saved;
  };
  if (bkBank) bkBank.onchange = () => {
    const other = bkBank.value === '__other';
    byId('bkBinBox').hidden = !other;
    if (other) byId('bkBin').focus();
  };
  if (bkTpl) bkTpl.oninput = previewNote;
  previewNote();
  const readBank = () => {
    const sel = bkBank ? bkBank.value : '';
    const bin = sel === '__other' ? (bkBin ? bkBin.value.trim() : '') : sel;
    const hit = BANKS.find(x => x.bin === bin);
    return { bin, bankName: hit ? hit.name : (bin ? 'BIN ' + bin : ''),
      accountNo: (byId('bkAccount')||{value:''}).value.trim().replace(/\s+/g,''),
      accountName: (byId('bkName')||{value:''}).value.trim(),
      template: (bkTpl||{value:'{ma} {dot}'}).value.trim() || '{ma} {dot}' };
  };
  const validateBank = () => {
    const nb = readBank();
    if (!/^\d{6}$/.test(nb.bin)){ toast('err','Chưa chọn ngân hàng','Mã BIN phải gồm 6 chữ số.'); return null; }
    if (!/^\d{6,20}$/.test(nb.accountNo)){ toast('err','Số tài khoản không hợp lệ','Chỉ gồm chữ số, 6–20 ký tự.'); return null; }
    return nb;
  };
  b('bkSave', () => {
    const nb = validateBank(); if (!nb) return;
    S.meta.bank = nb; save(); render();
    toast('ok','Đã lưu tài khoản nhận tiền', `${nb.bankName} · ${nb.accountNo}`);
  });
  b('bkTest', () => {
    const nb = validateBank(); if (!nb) return;
    S.meta.bank = nb; save();
    openQRModal({ studentId:(S.students.find(x=>x.active!==false)||{}).id, periodId:(S.periods[0]||{}).id });
  });
  document.querySelectorAll('#main [data-set-theme]').forEach(x =>
    x.onclick = () => { P.theme = x.dataset.setTheme; applyPrefs(); render(); });
  document.querySelectorAll('#main [data-fs]').forEach(x =>
    x.onclick = () => { P.fontScale = Number(x.dataset.fs); applyPrefs(); render(); });
  const r = byId('pReading'); if (r) r.onchange = () => { P.reading = r.checked; applyPrefs(); };
  const mo = byId('pMotion'); if (mo) mo.onchange = () => { P.noMotion = mo.checked; applyPrefs(); };
  b('btnSelfTest', () => byId('testOut').innerHTML = runSelfTest());
  b('btnDemo', loadDemo);
  b('btnClearDemo', () => confirmDialog({
    title:'Xoá dữ liệu demo?', danger:true, okLabel:'Xoá demo',
    message:'Chỉ xoá các bản ghi được đánh dấu demo. Dữ liệu bạn tự nhập được giữ nguyên.',
    onOk(){
      ['students','periods','incomes','expenses'].forEach(k => S[k] = S[k].filter(x => !x.demo));
      S.meta.demo = false; save(); render(); toast('ok','Đã xoá dữ liệu demo');
    }}));
  b('btnClearAll', () => confirmDialog({
    title:'Xoá toàn bộ dữ liệu?', danger:true, okLabel:'Tôi hiểu, xoá hết',
    message:'Toàn bộ sinh viên, đợt thu, khoản thu và khoản chi sẽ bị xoá khỏi trình duyệt này. <b>Không thể hoàn tác.</b>',
    onOk(){ S = emptyState(); save(); render(); toast('warn','Đã xoá toàn bộ dữ liệu'); }}));
}
function applyPrefs(){
  document.documentElement.dataset.theme = P.theme;
  document.body.classList.toggle('reading', !!P.reading);
  document.body.classList.toggle('no-motion', !!P.noMotion);
  document.documentElement.style.setProperty('--fs-scale', P.fontScale || 1);
  savePrefs();
}

/* ==========================================================================
   EVENTS — form thêm/sửa/xoá cho từng loại bản ghi
   ========================================================================== */
function toastAction(kind, title, msg, label, fn){
  const box = byId('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.style.setProperty('--tdur','8s');
  t.innerHTML = `<div class="msg"><b>${esc(title)}</b>${esc(msg||'')}</div>
    <button class="btn sm" data-act>${esc(label)}</button>`;
  const kill = () => { t.classList.add('out'); setTimeout(()=>t.remove(),200); };
  t.querySelector('[data-act]').onclick = () => { kill(); fn(); };
  box.appendChild(t);
  let timer = setTimeout(kill, 8000);
  t.onmouseenter = () => clearTimeout(timer);
  t.onmouseleave = () => { timer = setTimeout(kill, 2500); };
}
function fieldErr(input, msg){
  const f = input.closest('.field') || input.parentElement;
  f.querySelectorAll('.err').forEach(e=>e.remove());
  if (msg){
    input.setAttribute('aria-invalid','true');
    const d = document.createElement('div'); d.className = 'err'; d.textContent = msg;
    f.appendChild(d);
    input.closest('.modal')?.classList.add('shake');
    setTimeout(()=>input.closest('.modal')?.classList.remove('shake'), 360);
    input.focus();
  } else input.removeAttribute('aria-invalid');
  return !msg;
}
/** Ô nhập tiền: gõ 50000 hoặc 50.000 đều được, tự chèn dấu nhóm nghìn khi gõ. */
function wireMoney(input){
  input.classList.add('money-in');
  input.setAttribute('inputmode','numeric');
  const fmt = () => { const v = parseMoney(input.value); input.value = v ? fmtNum(v) : ''; };
  input.addEventListener('input', fmt);
  input.addEventListener('blur', fmt);
  fmt();
}
function fundSegs(name, value){
  return `<div class="segs">${FUND_KEYS.map(k=>`
    <label class="seg ${value===k?'on':''}" data-fund="${k}">
      <input type="radio" name="${name}" value="${k}" ${value===k?'checked':''} required>
      <span class="dot" style="background:var(--fund-${FUNDS[k].cls})"></span>${esc(FUNDS[k].label)}
    </label>`).join('')}</div>`;
}
function wireFundSegs(m, onChange){
  m.all('.seg input').forEach(r => r.onchange = () => {
    m.all('.seg').forEach(s => s.classList.toggle('on', s.querySelector('input').checked));
    const form = m.el('form');
    if (form){ form.classList.remove('fund-lop','fund-doan');
      form.classList.add('fund-' + (FUNDS[r.value] ? FUNDS[r.value].cls : '')); }
    if (onChange) onChange(r.value);
  });
}
const currentFund = m => (m.el('.seg input:checked') || {}).value || '';
const studentOptionLabel = s => `${s.fullName} — ${s.code}`;
function resolveStudent(text){
  const t = String(text||'').trim();
  if (!t) return null;
  let hit = S.students.find(s => studentOptionLabel(s) === t);
  if (hit) return hit;
  const code = t.replace(/\D/g,'');
  if (code) hit = S.students.find(s => s.code === code);
  if (hit) return hit;
  const q = noAccent(t);
  const matches = S.students.filter(s => noAccent(s.fullName) === q);
  return matches.length === 1 ? matches[0] : null;
}
function studentDatalist(){
  return `<datalist id="dlStudents">${S.students.filter(s=>s.active!==false)
    .map(s=>`<option value="${esc(studentOptionLabel(s))}"></option>`).join('')}</datalist>`;
}

/* ---------- THU ---------- */
function openIncomeModal(opt){
  opt = opt || {};
  const editing = opt.id ? S.incomes.find(i=>i.id===opt.id) : null;
  if (!S.periods.length && !editing){
    return confirmDialog({ title:'Chưa có đợt thu', okLabel:'Tạo đợt thu ngay',
      message:'Tiền thu cần thuộc về một đợt thu để hệ thống biết ai đã nộp đủ. Bạn muốn tạo đợt thu trước không?',
      onOk(){ openPeriodModal(); }});
  }
  const st = editing ? editing : {};
  const initPeriodId = opt.periodId || st.periodId || (S.periods.find(p=>p.status!=='CLOSED')||S.periods[0]||{}).id || '';
  const initPeriod = periodById(initPeriodId);
  const initFund = st.fund || (initPeriod ? initPeriod.fund : FUND_KEYS[0]);
  const initStudentId = opt.studentId || st.studentId || '';
  const initStudent = initStudentId ? studentById(initStudentId) : null;
  const remaining = (initStudent && initPeriod) ? Math.max(int(initPeriod.amountPerStudent) - paidOf(initStudent.id, initPeriod.id), 0) : 0;
  const initAmount = editing ? int(editing.amount) : (remaining || (initPeriod ? int(initPeriod.amountPerStudent) : 0));

  openModal({
    title: editing ? 'Sửa khoản thu' : 'Thêm khoản thu',
    sub: 'Mỗi khoản thu bắt buộc thuộc đúng một quỹ.',
    body: `<form id="fIncome" class="fund-${FUNDS[initFund]?FUNDS[initFund].cls:''}">
      <div class="field"><label>Rút vào quỹ nào? <span style="color:var(--expense)">*</span></label>
        ${fundSegs('iFundR', initFund)}</div>
      <div class="fundframe">
        <div class="f2">
          <div class="field"><label for="inDate">Ngày nộp <span style="color:var(--expense)">*</span></label>
            <input type="date" id="inDate" value="${esc(st.date || todayISO())}" required></div>
          <div class="field"><label for="inPeriod">Đợt thu</label>
            <select id="inPeriod"><option value="">— Thu ngoài đợt (tài trợ, nguồn khác) —</option>
              ${S.periods.map(p=>`<option value="${p.id}" data-fund="${p.fund}" data-amt="${p.amountPerStudent}"
                ${p.id===initPeriodId?'selected':''}>${esc(p.name)} (${fmtNum(p.amountPerStudent)}/SV)${p.status==='CLOSED'?' · đã đóng':''}</option>`).join('')}
            </select><div class="hint" id="periodHint"></div></div>
        </div>
        <div class="field"><label>Người nộp <span style="color:var(--expense)">*</span></label>
          <div class="chips" style="margin-bottom:.4rem">
            <button type="button" class="chip ${!st.payerName||initStudent?'on':''}" data-payer="student">Sinh viên trong lớp</button>
            <button type="button" class="chip ${(st.payerName&&!st.studentId)?'on':''}" data-payer="other">Nguồn khác</button>
          </div>
          <input type="text" id="inStudent" list="dlStudents" autocomplete="off"
            placeholder="Gõ tên hoặc mã SV…" value="${esc(initStudent?studentOptionLabel(initStudent):'')}"
            ${(st.payerName&&!st.studentId)?'hidden':''}>
          <input type="text" id="inPayer" placeholder="Tên người/đơn vị nộp" value="${esc(st.payerName||'')}"
            ${(st.payerName&&!st.studentId)?'':'hidden'}>
          ${studentDatalist()}
          <div class="hint" id="payHint"></div></div>
        <div class="f2">
          <div class="field"><label for="inAmount">Số tiền (₫) <span style="color:var(--expense)">*</span></label>
            <input type="text" id="inAmount" value="${initAmount||''}" data-autofocus></div>
          <div class="field"><label for="inMethod">Hình thức</label>
            <select id="inMethod">${Object.entries(METHODS).map(([k,v])=>
              `<option value="${k}" ${st.method===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
        </div>
        <div class="f2">
          <div class="field"><label for="inBy">Người thu</label>
            <input type="text" id="inBy" value="${esc(st.collectedBy || 'Thủ quỹ')}"></div>
          <div class="field"><label for="inNote">Ghi chú</label>
            <input type="text" id="inNote" value="${esc(st.note||'')}"></div>
        </div>
        <div id="inWarn"></div>
      </div></form>`,
    footer: `${editing?'<button class="btn danger left" id="inDel">Xoá khoản thu này</button>':'<button class="btn ghost left" id="inQR">Xem QR chuyển khoản</button>'}
      <button class="btn" data-close>Huỷ</button>
      <button class="btn income" id="inSave">${editing?'Lưu thay đổi':'Ghi nhận thu'}</button>`,
    onMount(m){
      const amount = m.el('#inAmount'); wireMoney(amount);
      const selP = m.el('#inPeriod'), sInp = m.el('#inStudent'), pInp = m.el('#inPayer');
      let payerMode = (st.payerName && !st.studentId) ? 'other' : 'student';
      const syncPayerMode = () => {
        m.all('[data-payer]').forEach(c => c.classList.toggle('on', c.dataset.payer === payerMode));
        sInp.hidden = payerMode !== 'student';
        pInp.hidden = payerMode === 'student';
      };
      m.all('[data-payer]').forEach(c => c.onclick = () => { payerMode = c.dataset.payer; syncPayerMode(); });
      syncPayerMode();

      // đổi đợt thu ⇒ quỹ và số tiền gợi ý đi theo đợt (không cho lệch quỹ)
      const syncPeriod = () => {
        const o = selP.selectedOptions[0];
        const hint = m.el('#periodHint');
        if (o && o.dataset.fund){
          const r = m.el(`.seg input[value="${o.dataset.fund}"]`);
          if (r && !r.checked){ r.checked = true; r.dispatchEvent(new Event('change')); }
          hint.textContent = `Đợt này thuộc ${FUNDS[o.dataset.fund].label} · ${fmtVND(o.dataset.amt)}/SV`;
          const sObj = resolveStudent(sInp.value);
          if (sObj && !editing){
            const rem = Math.max(int(o.dataset.amt) - paidOf(sObj.id, selP.value), 0);
            amount.value = fmtNum(rem || int(o.dataset.amt));
          }
        } else hint.textContent = 'Không thuộc đợt nào — chọn quỹ thủ công bên trên.';
        checkOver();
      };
      selP.onchange = syncPeriod; syncPeriod();
      sInp.oninput = () => {
        const sObj = resolveStudent(sInp.value);
        const h = m.el('#payHint');
        if (!sInp.value.trim()) { h.textContent = ''; return; }
        if (!sObj){ h.textContent = 'Chưa khớp sinh viên nào — chọn từ danh sách gợi ý.'; return; }
        const p = periodById(selP.value);
        const paid = p ? paidOf(sObj.id, p.id) : 0;
        h.textContent = p ? `${sObj.fullName} · đã nộp ${fmtVND(paid)} / ${fmtVND(p.amountPerStudent)} ở đợt này` : sObj.fullName;
        if (p && !editing) amount.value = fmtNum(Math.max(int(p.amountPerStudent) - paid, 0) || int(p.amountPerStudent));
        checkOver();
      };
      function checkOver(){
        const w = m.el('#inWarn'), p = periodById(selP.value), sObj = resolveStudent(sInp.value);
        w.innerHTML = '';
        if (!p || !sObj) return;
        const paid = paidOf(sObj.id, p.id) - (editing && editing.periodId===p.id && editing.studentId===sObj.id ? int(editing.amount) : 0);
        const after = paid + parseMoney(amount.value);
        if (after > int(p.amountPerStudent))
          w.innerHTML = `<div class="warnbox">Sau khoản này, ${esc(sObj.fullName)} sẽ nộp <b>${fmtVND(after)}</b>
            trong khi đợt chỉ yêu cầu <b>${fmtVND(p.amountPerStudent)}</b> (thừa ${fmtVND(after - int(p.amountPerStudent))}).
            Vẫn lưu được nếu đây là nộp bù hộ người khác.</div>`;
      }
      amount.addEventListener('input', checkOver);
      wireFundSegs(m, () => {
        // giữ ràng buộc: quỹ của bản ghi phải trùng quỹ của đợt
        const p = periodById(selP.value);
        if (p && p.fund !== currentFund(m)) selP.value = '';
        checkOver();
      });
      if (editing) m.el('#inDel').onclick = () => { m.close(); removeRecord('incomes', editing.id); };
      if (!editing) m.el('#inQR').onclick = () => {
        const sObj = resolveStudent(sInp.value);
        if (!sObj) return toast('err','Chọn sinh viên trước','Mã QR cần biết nộp cho ai để ghi đúng nội dung chuyển khoản.');
        m.close();
        openQRModal({ studentId:sObj.id, periodId:selP.value, amount:parseMoney(amount.value) });
      };

      m.el('#inSave').onclick = () => {
        const fund = currentFund(m);
        if (!fund) return toast('err','Chưa chọn quỹ','Mỗi khoản thu phải thuộc đúng một quỹ.');
        const date = m.el('#inDate').value;
        if (!fieldErr(m.el('#inDate'), date ? '' : 'Chọn ngày nộp')) return;
        const amt = parseMoney(amount.value);
        if (!fieldErr(amount, amt > 0 ? '' : 'Số tiền phải lớn hơn 0')) return;
        let studentId = null, payerName = '';
        if (payerMode === 'student'){
          const sObj = resolveStudent(sInp.value);
          if (!fieldErr(sInp, sObj ? '' : 'Chọn một sinh viên trong danh sách')) return;
          studentId = sObj.id; payerName = sObj.fullName;
        } else {
          payerName = pInp.value.trim();
          if (!fieldErr(pInp, payerName ? '' : 'Nhập tên người/đơn vị nộp')) return;
        }
        const periodId = m.el('#inPeriod').value || null;
        const p = periodById(periodId);
        if (p && p.fund !== fund)
          return toast('err','Lệch quỹ', `Đợt “${p.name}” thuộc ${FUNDS[p.fund].label}, không thể ghi vào ${FUNDS[fund].label}.`);
        const rec = { id: editing ? editing.id : uid(), date, fund, periodId, studentId, payerName,
          amount: amt, method: m.el('#inMethod').value, collectedBy: m.el('#inBy').value.trim(),
          note: m.el('#inNote').value.trim() };
        if (editing) Object.assign(editing, rec); else S.incomes.push(rec);
        save(); m.close(); ui.flashIds = [rec.id];
        if (ui.view !== 'incomes' && ui.view !== 'students') go('incomes'); else render();
        toast('ok', editing ? 'Đã lưu thay đổi' : 'Đã ghi nhận thu ' + fmtVND(amt),
          `${FUNDS[fund].label} · ${payerName}`);
      };
    }
  });
}

/* ---------- CHI ---------- */
function openExpenseModal(opt){
  opt = opt || {};
  const editing = opt.id ? S.expenses.find(e=>e.id===opt.id) : null;
  const st = editing || {};
  const initFund = st.fund || FUND_KEYS[0];
  const buyers = [...new Set(S.expenses.map(e=>e.buyer).filter(Boolean))];
  openModal({
    title: editing ? 'Sửa khoản chi' : 'Thêm khoản chi',
    sub: 'Ghi rõ mua gì, ai đi mua, và rút từ quỹ nào.',
    body: `<form id="fExp" class="fund-${FUNDS[initFund]?FUNDS[initFund].cls:''}">
      <div class="field"><label>Rút từ quỹ nào? <span style="color:var(--expense)">*</span></label>
        ${fundSegs('eFundR', initFund)}
        <div class="hint" id="balHint"></div></div>
      <div class="fundframe">
        <div class="f2">
          <div class="field"><label for="exDate">Ngày chi <span style="color:var(--expense)">*</span></label>
            <input type="date" id="exDate" value="${esc(st.date || todayISO())}" required></div>
          <div class="field"><label for="exAmount">Số tiền (₫) <span style="color:var(--expense)">*</span></label>
            <input type="text" id="exAmount" value="${st.amount||''}"></div>
        </div>
        <div class="field"><label for="exItem">Nội dung / Mua món gì <span style="color:var(--expense)">*</span></label>
          <input type="text" id="exItem" value="${esc(st.item||'')}" placeholder="VD: Nước + bánh sinh hoạt lớp" data-autofocus></div>
        <div class="f2">
          <div class="field"><label for="exCat">Danh mục</label>
            <select id="exCat">${CATEGORIES.map(c=>`<option value="${esc(c)}" ${st.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
          <div class="field"><label for="exBuyer">Người đi mua <span style="color:var(--expense)">*</span></label>
            <input type="text" id="exBuyer" list="dlBuyers" value="${esc(st.buyer||'')}" placeholder="Ai đi mua khoản này?">
            <datalist id="dlBuyers">${buyers.map(b=>`<option value="${esc(b)}"></option>`).join('')}</datalist></div>
        </div>
        <div class="f2">
          <div class="field"><label for="exNote">Ghi chú</label><input type="text" id="exNote" value="${esc(st.note||'')}"></div>
          <div class="field"><label>Hoá đơn</label>
            <label class="check"><input type="checkbox" id="exRcp" ${st.hasReceipt?'checked':''}><span>Có hoá đơn / ảnh chụp</span></label></div>
        </div>
        <div id="exWarn"></div>
      </div></form>`,
    footer: `${editing?'<button class="btn danger left" id="exDel">Xoá khoản chi này</button>':''}
      <button class="btn" data-close>Huỷ</button>
      <button class="btn expense" id="exSave">${editing?'Lưu thay đổi':'Ghi nhận chi'}</button>`,
    onMount(m){
      const amount = m.el('#exAmount'); wireMoney(amount);
      const refresh = () => {
        const fund = currentFund(m);
        const bal = lifetimeBalance(fund) + (editing && editing.fund===fund ? int(editing.amount) : 0);
        m.el('#balHint').innerHTML = fund
          ? `Tồn quỹ hiện tại của <b>${esc(FUNDS[fund].label)}</b>: <b class="num">${fmtVNDs(bal)}</b>` : '';
        const amt = parseMoney(amount.value), w = m.el('#exWarn');
        w.innerHTML = (fund && amt > bal)
          ? `<div class="warnbox"><span>⚠</span><span>Khoản chi <b>${fmtVND(amt)}</b> vượt tồn quỹ
             <b>${esc(FUNDS[fund].label)}</b> (${fmtVNDs(bal)}) — thiếu <b>${fmtVND(amt-bal)}</b>.
             Vẫn lưu được nếu bạn ứng trước, bản ghi sẽ được đánh dấu ⚠ vượt quỹ.</span></div>` : '';
      };
      amount.addEventListener('input', refresh);
      wireFundSegs(m, refresh); refresh();
      if (editing) m.el('#exDel').onclick = () => { m.close(); removeRecord('expenses', editing.id); };
      m.el('#exSave').onclick = () => {
        const fund = currentFund(m);
        if (!fund) return toast('err','Chưa chọn quỹ','Phải chỉ rõ rút từ Quỹ Lớp hay Quỹ Đoàn.');
        const date = m.el('#exDate').value;
        if (!fieldErr(m.el('#exDate'), date ? '' : 'Chọn ngày chi')) return;
        const amt = parseMoney(amount.value);
        if (!fieldErr(amount, amt > 0 ? '' : 'Số tiền phải lớn hơn 0')) return;
        const item = m.el('#exItem').value.trim();
        if (!fieldErr(m.el('#exItem'), item ? '' : 'Nhập nội dung đã mua')) return;
        const buyer = m.el('#exBuyer').value.trim();
        if (!fieldErr(m.el('#exBuyer'), buyer ? '' : 'Nhập tên người đi mua')) return;
        const bal = lifetimeBalance(fund) + (editing && editing.fund===fund ? int(editing.amount) : 0);
        const commit = (over) => {
          const rec = { id: editing?editing.id:uid(), date, fund, item, category:m.el('#exCat').value,
            buyer, amount:amt, hasReceipt:m.el('#exRcp').checked, note:m.el('#exNote').value.trim(),
            overdraft: over };
          if (editing) Object.assign(editing, rec); else S.expenses.push(rec);
          save(); m.close(); ui.flashIds = [rec.id];
          if (ui.view !== 'expenses') go('expenses'); else render();
          toast(over?'warn':'ok', editing?'Đã lưu thay đổi':'Đã ghi nhận chi ' + fmtVND(amt),
            `${FUNDS[fund].label} · ${item}${over?' · vượt quỹ':''}`);
        };
        if (amt > bal) confirmDialog({
          title:'Chi vượt tồn quỹ', danger:true, okLabel:'Vẫn ghi nhận',
          message:`Tồn quỹ <b>${esc(FUNDS[fund].label)}</b> chỉ còn <b>${fmtVNDs(bal)}</b> nhưng khoản chi là
                   <b>${fmtVND(amt)}</b> (thiếu <b>${fmtVND(amt-bal)}</b>).<br>Bản ghi sẽ được đánh dấu ⚠ vượt quỹ.`,
          onOk(){ commit(true); }});
        else commit(false);
      };
    }
  });
}

  }
  confirmDialog({
    title:'Xoá sinh viên?', danger:true, okLabel:'Xoá',

  S.periods.push(copy); save(); render();
  toast('ok','Đã nhân bản đợt thu', copy.name);

/* ---------- XOÁ THU / CHI (có hoàn tác) ---------- */
function removeRecord(kind, id){
  const arr = S[kind], idx = arr.findIndex(x=>x.id===id);
  if (idx < 0) return;
  const r = arr[idx];
  const label = kind === 'incomes'
    ? `khoản thu ${fmtVND(r.amount)} của ${r.studentId ? (studentById(r.studentId)?.fullName||'') : r.payerName}`
    : `khoản chi ${fmtVND(r.amount)} — ${r.item}`;
  confirmDialog({
    title: kind === 'incomes' ? 'Xoá khoản thu?' : 'Xoá khoản chi?', danger:true, okLabel:'Xoá',
    message: `Xoá ${esc(label)} ngày ${fmtDate(r.date)} (${esc(FUNDS[r.fund].label)})?<br>
              Tồn quỹ sẽ được tính lại ngay sau khi xoá.`,
    onOk(){
      const obj = arr.splice(idx,1)[0];
      save(); render();
      toastAction('warn','Đã xoá', label, 'Hoàn tác', () => {
        arr.splice(idx,0,obj); save(); render(); toast('ok','Đã hoàn tác', label); });
    }});
}

/* ---------- THU THEO LÔ ---------- */
function openBatchModal(periodId){
  if (!S.periods.length) return toast('err','Chưa có đợt thu','Tạo đợt thu trước khi thu theo lô.');
  if (!S.students.length) return toast('err','Chưa có sinh viên','Nhập danh sách lớp trước.');
  let pid = periodId || (S.periods.find(p=>p.status!=='CLOSED')||S.periods[0]).id;
  openModal({
    title:'Thu theo lô', wide:true,
    sub:'Tick những sinh viên đã nộp — mỗi người sẽ tạo một bản ghi thu riêng.',
    body:`<div class="f3">
        <div class="field"><label for="bPeriod">Đợt thu</label><select id="bPeriod">
          ${S.periods.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)} — ${esc(FUNDS[p.fund].label)} (${fmtNum(p.amountPerStudent)}/SV)</option>`).join('')}
        </select></div>
        <div class="field"><label for="bDate">Ngày nộp</label><input type="date" id="bDate" value="${todayISO()}"></div>
        <div class="field"><label for="bBy">Người thu</label><input type="text" id="bBy" value="Thủ quỹ"></div>
      </div>
      <div class="row" style="margin-bottom:.5rem">
        <button class="btn sm" id="bAll">Chọn tất cả người còn thiếu</button>
        <button class="btn sm ghost" id="bNone">Bỏ chọn hết</button>
        <span class="small muted" id="bCount" style="margin-left:auto"></span>
      </div>
      <div id="bList" style="max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm)"></div>`,
    footer:`<button class="btn" data-close>Huỷ</button><button class="btn income" id="bSave">Ghi nhận</button>`,
    onMount(m){
      const sel = m.el('#bPeriod');
      const draw = () => {
        pid = sel.value;
        const p = periodById(pid);
        const rows = S.students.filter(s=>s.active!==false).map(s=>{
          const paid = paidOf(s.id, pid), rem = Math.max(int(p.amountPerStudent) - paid, 0);
          return { s, paid, rem };
        });
        m.el('#bList').innerHTML = `<table><thead><tr><th style="width:36px"></th><th>Sinh viên</th>
            <th class="r">Đã nộp</th><th class="r">Còn thiếu</th><th class="r" style="width:130px">Ghi nhận (₫)</th></tr></thead>
          <tbody>${rows.map(r=>`<tr>
            <td><input type="checkbox" class="bck" data-id="${r.s.id}" ${r.rem>0?'checked':''} ${r.rem===0?'disabled':''}></td>
            <td>${esc(r.s.fullName)}<div class="small muted num">${esc(r.s.code)}</div></td>
            <td class="money in">${r.paid?fmtVND(r.paid):'—'}</td>
            <td class="money out">${r.rem?fmtVND(r.rem):'<span class="badge ok">đủ</span>'}</td>
            <td><input type="text" class="bamt" data-id="${r.s.id}" value="${r.rem||''}" ${r.rem===0?'disabled':''}></td>
          </tr>`).join('')}</tbody></table>`;
        m.all('.bamt').forEach(wireMoney);
        m.all('.bck').forEach(c => c.onchange = count);
        count();
      };
      const count = () => {
        const on = m.all('.bck').filter(c=>c.checked);
        const sum = on.reduce((a,c)=>a + parseMoney(m.el(`.bamt[data-id="${c.dataset.id}"]`).value), 0);
        m.el('#bCount').innerHTML = `Đã chọn <b>${on.length}</b> SV · tổng <b class="num">${fmtVND(sum)}</b>`;
      };
      sel.onchange = draw; draw();
      m.el('#bAll').onclick  = () => { m.all('.bck').forEach(c => { if(!c.disabled) c.checked = true; }); count(); };
      m.el('#bNone').onclick = () => { m.all('.bck').forEach(c => c.checked = false); count(); };
      m.el('#bSave').onclick = () => {
        const p = periodById(sel.value), date = m.el('#bDate').value || todayISO(), by = m.el('#bBy').value.trim();
        const picked = m.all('.bck').filter(c=>c.checked);
        if (!picked.length) return toast('err','Chưa chọn sinh viên nào');
        let n = 0, sum = 0;
        picked.forEach(c => {
          const amt = parseMoney(m.el(`.bamt[data-id="${c.dataset.id}"]`).value);
          if (amt <= 0) return;
          S.incomes.push({ id:uid(), date, fund:p.fund, periodId:p.id, studentId:c.dataset.id,
            payerName: studentById(c.dataset.id)?.fullName || '', amount:amt, method:'CASH',
            collectedBy:by, note:'Thu theo lô' });
          n++; sum += amt;
        });
        save(); m.close(); render();
        toast('ok',`Đã ghi nhận ${n} khoản thu`, `${FUNDS[p.fund].label} · tổng ${fmtVND(sum)}`);
      };
    }
  });
}
